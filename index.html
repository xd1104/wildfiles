<style>
:root{--ground:#0E1216;--surface:#171C22;--line:#29313A;--text:#EEF0F2;--muted:#8C949D;--accent:#FFD23F}

.links a{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
.links a span{color:var(--muted);font-weight:400;font-size:14px}
.links a:hover,.links a:focus-visible{border-color:var(--accent);outline:none}
