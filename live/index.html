<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="荒野數據">
<link rel="apple-touch-icon" href="../avatar.jpg">
<title>荒野檔案 即時數據</title>
<style>
:root{
  --ground:#0E1216;--surface:#161B21;--surface2:#1D232A;--line:#29313A;
  --text:#EEF0F2;--muted:#8C949D;--faint:#5B636C;--accent:#FFD23F;--ink:#1A1600;
  --ok:#5CC98A;--warn:#FF9F43;--bad:#FF5F55;
  --yt:#FF5F55;--tt:#3DD6D0;--ig:#D774C0;--fb:#5E8EF0;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top,0px) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.top{display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.top img{width:40px;height:40px;border-radius:50%}
.top b{display:block;font-size:18px;letter-spacing:.04em;line-height:1.15}
.top small{color:var(--accent);font-family:var(--num);letter-spacing:.22em;font-weight:600;font-size:12px}
.top .re{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.warn i{background:var(--warn)} .status.bad i{background:var(--bad)}
.status.bad{color:var(--bad)}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:26px 0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:42px;line-height:1.05;margin-top:4px}
.stat .d{font-size:13px;color:var(--muted)}
.up{color:var(--ok)}
.pf{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.pf .nm{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.pf .c{text-align:right}
.pf .c .n{font-size:21px}
.pf .c small{display:block;font-size:11px;color:var(--muted)}
.pf .off{grid-column:2/4;text-align:right;font-size:12px;color:var(--faint)}
.pf .err{grid-column:1/4;font-size:12px;color:var(--bad)}
.chart{background:var(--surface);border-radius:12px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.vid{padding:12px 0;border-top:1px solid var(--line)}
.vid .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.vid .no{font-family:var(--num);color:var(--accent);font-weight:600;margin-right:6px}
.vid .tot{font-size:26px}
.vid .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.note{font-size:12px;color:var(--faint);margin-top:18px}
/* lock */
.lock{max-width:360px;margin:12vh auto 0;text-align:center}
.lock img{width:84px;height:84px;border-radius:50%;margin-bottom:14px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;text-align:center}
.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.lock button:disabled{opacity:.5}
.lock .msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  'use strict';
  /* 解密跟 animal-shorts/live/live_stats.py（＝交易手機監控 monitor_push.py 同一套）：
     PBKDF2-SHA256(密碼, salt, iter) ⇒ k_enc‖k_mac；tag = HMAC(k_mac, "tlmon1"‖t‖nonce‖ct)；金鑰流 = HMAC(k_enc, nonce‖序號)
     記住這台手機存的是算出來的鑰匙，不是密碼。跟交易監控同網域（xd1104.github.io），手機已記住的鑰匙直接沿用。 */
  var API = 'https://api.github.com/repos/xd1104/wildfiles/contents/stats.json?ref=stats';
  var RAW = 'https://raw.githubusercontent.com/xd1104/wildfiles/stats/stats.json';
  var LS = 'wfl.key.v1', LS_SHARED = 'tlmon.key.v1';
  var MAGIC = new TextEncoder().encode('tlmon1');
  var PF = [{k:'yt',n:'YouTube',c:'var(--yt)'},{k:'tt',n:'TikTok',c:'var(--tt)'},{k:'ig',n:'Instagram',c:'var(--ig)'},{k:'fb',n:'Facebook',c:'var(--fb)'}];
  var app = document.getElementById('app');
  var keys = null, box = null, data = null, etag = null, timer = null;

  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function ub64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  function cat(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length;}return o;}
  function eq(a,b){if(a.length!==b.length)return false;var d=0;for(var i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}
  function derive(pw,salt,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,512);})
    .then(function(bits){var u=new Uint8Array(bits);return {salt:ub64(salt),iter:iter,enc:u.slice(0,32),mac:u.slice(32)};});}
  function hk(raw){return crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign']);}
  function hm(key,d){return crypto.subtle.sign('HMAC',key,d).then(function(s){return new Uint8Array(s);});}
  function open(bx,k){var nonce=b64(bx.nonce),ct=b64(bx.ct),tag=b64(bx.tag),t=new TextEncoder().encode(String(bx.t));
    return Promise.all([hk(k.mac),hk(k.enc)]).then(function(h){return hm(h[0],cat(MAGIC,t,nonce,ct)).then(function(want){
      if(!eq(want,tag))throw new Error('bad');var n=Math.ceil(ct.length/32),jobs=[];
      for(var i=0;i<n;i++)jobs.push(hm(h[1],cat(nonce,new Uint8Array([(i>>>24)&255,(i>>>16)&255,(i>>>8)&255,i&255]))));
      return Promise.all(jobs).then(function(bl){var ks=cat.apply(null,bl),pt=new Uint8Array(ct.length);for(var j=0;j<ct.length;j++)pt[j]=ct[j]^ks[j];
        return JSON.parse(new TextDecoder().decode(pt));});});});}
  function load(name){try{var o=JSON.parse(localStorage.getItem(name)||'null');if(!o)return null;return {salt:o.salt,iter:o.iter,enc:b64(o.enc),mac:b64(o.mac)};}catch(e){return null;}}
  function save(k){try{localStorage.setItem(LS,JSON.stringify({salt:k.salt,iter:k.iter,enc:ub64(k.enc),mac:ub64(k.mac)}));}catch(e){}}

  function fetchBox(){var h={'Accept':'application/vnd.github.raw'};if(etag)h['If-None-Match']=etag;
    return fetch(API,{headers:h,cache:'no-store'}).then(function(r){if(r.status===304&&box)return box;if(!r.ok)throw new Error('api '+r.status);etag=r.headers.get('ETag')||etag;return r.json();})
      .catch(function(){return fetch(RAW+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('raw '+r.status);return r.json();});})
      .then(function(b){box=b;return b;});}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return n==null?'—':Number(n).toLocaleString('zh-TW');}
  function plus(n){return n==null?'':(n>0?'<span class="up">+'+fmt(n)+'</span>':n<0?fmt(n):'±0');}
  function ago(sec){sec=Math.max(0,Math.round(sec));if(sec<90)return '剛剛';if(sec<3600)return Math.round(sec/60)+' 分鐘前';var h=Math.floor(sec/3600);return h<48?h+' 小時前':Math.floor(h/24)+' 天前';}

  /* ── 鎖 ── */
  function lockView(msg){
    app.innerHTML='<div class="lock"><img src="../avatar.jpg" alt=""><h1>荒野檔案 即時數據</h1><p>輸入交易儀表板手機版那組密碼</p>'+
      '<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">'+
      '<label><input id="rem" type="checkbox" checked> 記住這台手機</label><button id="go" type="submit">打開</button></form><div class="msg" id="msg">'+esc(msg||'')+'</div></div>';
    document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
      var pw=document.getElementById('pw').value,go=document.getElementById('go'),m=document.getElementById('msg');if(!pw)return;
      go.disabled=true;go.textContent='解鎖中…';m.textContent='';
      (box?Promise.resolve(box):fetchBox()).then(function(bx){return derive(pw,b64(bx.kdf.salt),bx.kdf.iter).then(function(k){return open(bx,k).then(function(d){
        keys=k;if(document.getElementById('rem').checked)save(k);data=d;render();start();});});})
      .catch(function(e){go.disabled=false;go.textContent='打開';m.textContent=String(e.message)==='bad'?'密碼不對，再試一次':'讀不到資料，檢查網路後再試';});});
    setTimeout(function(){var p=document.getElementById('pw');p&&p.focus();},50);
  }

  /* ── 畫面 ── */
  function sumAt(h,key){var s=0,any=false;for(var p in (h[key]||{})){if(h[key][p]!=null){s+=h[key][p];any=true;}}return any?s:null;}
  function past(hist,hours){var cut=Date.now()-hours*3600e3,best=null;for(var i=0;i<hist.length;i++){if(new Date(hist[i].at).getTime()<=cut)best=hist[i];}return best;}
  function render(){
    var d=data,age=(Date.now()/1000)-box.t,st=age>90*60?'bad':age>45*60?'warn':'';
    var hist=d.hist||[],h24=past(hist,24),now=hist[hist.length-1]||{v:{},f:{}};
    var views=0,fans=0;PF.forEach(function(p){var x=d.platforms[p.k];if(x&&x.ok){views+=x.totalViews||0;fans+=x.followers||0;}});
    var dv=h24?views-(sumAt(h24,'v')||0):null,df=h24?fans-(sumAt(h24,'f')||0):null;
    var h='<header class="top"><img src="../avatar.jpg" alt=""><div><b>荒野檔案</b><small>WILD FILES</small></div><button class="re" id="re" type="button">重新整理</button></header>'+
      '<div class="status '+st+'"><i></i>'+(st==='bad'?'超過 '+ago(age).replace('前','')+'沒更新，電腦可能關機或斷線':'數據更新於 '+ago(age)+'（每 30 分鐘自動更新）')+'</div>'+
      '<div class="hero"><div class="stat"><div class="k">總觀看</div><div class="v n">'+fmt(views)+'</div><div class="d">'+(h24?'過去 24 小時 '+plus(dv):'累積一天後顯示 24 小時增加')+'</div></div>'+
      '<div class="stat"><div class="k">總粉絲</div><div class="v n">'+fmt(fans)+'</div><div class="d">'+(h24?'過去 24 小時 '+plus(df):'　')+'</div></div></div>';
    h+='<h2>各平台</h2>';
    PF.forEach(function(p){var x=d.platforms[p.k]||{};var b=h24&&h24.v?h24.v[p.k]:null,bf=h24&&h24.f?h24.f[p.k]:null;
      h+='<div class="pf"><span class="nm"><span class="sw" style="background:'+p.c+'"></span>'+p.n+'</span>';
      if(x.ok)h+='<span class="c"><span class="n">'+fmt(x.totalViews)+'</span><small>觀看 '+(b!=null?plus(x.totalViews-b):'')+'</small></span><span class="c"><span class="n">'+fmt(x.followers)+'</span><small>粉絲 '+(bf!=null?plus(x.followers-bf):'')+'</small></span>';
      else if(x.pending)h+='<span class="off">還沒接上 API</span>';
      else h+='<span class="off" style="color:var(--bad)">這次沒抓到</span><span class="err">'+esc(x.err||'')+'</span>';
      h+='</div>';});
    h+='<h2>最近 3 天總觀看</h2>'+chart(hist);
    h+='<h2>每支片</h2>'+videos(d,h24);
    h+='<p class="note">YouTube 公開觀看數比後台的數據分析慢一些，詳細的留存率看荒野檔案控制台。</p>';
    app.innerHTML=h;
    document.getElementById('re').addEventListener('click',refresh);
  }
  function chart(hist){
    var cut=Date.now()-72*3600e3,pts=hist.filter(function(x){return new Date(x.at).getTime()>=cut;}).map(function(x){return {t:new Date(x.at).getTime(),v:sumAt(x,'v')};}).filter(function(p){return p.v!=null;});
    if(pts.length<2)return '<div class="empty">累積幾次更新後，這裡會畫出觀看數的變化。</div>';
    var W=340,H=150,l=40,r=8,t=10,b=22,iw=W-l-r,ih=H-t-b,t0=pts[0].t,t1=pts[pts.length-1].t,lo=pts[0].v,hi=pts[pts.length-1].v;
    for(var i=0;i<pts.length;i++){lo=Math.min(lo,pts[i].v);hi=Math.max(hi,pts[i].v);}
    if(hi===lo)hi=lo+1;var X=function(tt){return l+(t1===t0?iw:(tt-t0)/(t1-t0)*iw);},Y=function(v){return t+ih-(v-lo)/(hi-lo)*ih;};
    var d='',a='';pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);});
    a=d+'L'+X(t1).toFixed(1)+' '+(t+ih)+'L'+X(t0).toFixed(1)+' '+(t+ih)+'Z';
    var g='<path d="'+a+'" fill="rgba(255,210,63,.12)"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
    g+='<circle cx="'+X(t1)+'" cy="'+Y(hi)+'" r="3.5" fill="var(--accent)"/>';
    [lo,hi].forEach(function(v){g+='<text x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Barlow Condensed">'+fmt(v)+'</text>';});
    var lab=function(tt,anc){var dd=new Date(tt);return '<text x="'+X(tt)+'" y="'+(H-6)+'" text-anchor="'+anc+'" font-size="10" fill="var(--muted)" font-family="Barlow Condensed">'+(dd.getMonth()+1)+'/'+dd.getDate()+' '+String(dd.getHours()).padStart(2,'0')+':'+String(dd.getMinutes()).padStart(2,'0')+'</text>';};
    g+=lab(t0,'start')+lab(t1,'end');
    return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近 3 天總觀看">'+g+'</svg></div>';
  }
  function videos(d,h24){
    var rows={};PF.forEach(function(p){var x=d.platforms[p.k];if(!x||!x.ok)return;(x.videos||[]).forEach(function(v){
      var key=v.ep||(p.k+':'+v.id),r=rows[key]||(rows[key]={ep:v.ep,title:(v.ep&&d.episodes[v.ep]&&d.episodes[v.ep].title)||v.title,per:{},likes:0,comments:0});
      r.per[p.k]=v.views;r.likes+=v.likes||0;r.comments+=v.comments||0;});});
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.tot=0;for(var p in r.per)r.tot+=r.per[p];
      if(h24&&r.ep&&h24.e&&h24.e[r.ep]){var s=0;for(var q in h24.e[r.ep])s+=h24.e[r.ep][q];r.d24=r.tot-s;}return r;}).sort(function(a,b){return b.tot-a.tot;});
    if(!list.length)return '<div class="empty">還沒有片的數據。</div>';
    return list.map(function(r){var no=r.ep&&d.episodes[r.ep]?d.episodes[r.ep].no:null;
      return '<div class="vid"><div class="h"><span>'+(no?'<span class="no">#'+String(no).padStart(2,'0')+'</span>':'')+esc(r.title)+'</span><span class="tot n">'+fmt(r.tot)+'</span></div>'+
        '<div class="m">'+PF.filter(function(p){return r.per[p.k]!=null;}).map(function(p){return '<span>'+p.n+' '+fmt(r.per[p.k])+'</span>';}).join('')+
        '<span>讚 '+fmt(r.likes)+'</span><span>留言 '+fmt(r.comments)+'</span>'+(r.d24!=null?'<span>24 小時 '+plus(r.d24)+'</span>':'')+'</div></div>';}).join('');
  }

  function refresh(){var b=document.getElementById('re');if(b)b.textContent='更新中…';
    return fetchBox().then(function(bx){return open(bx,keys);}).then(function(d){data=d;render();})
      .catch(function(){if(b)b.textContent='沒連上，再按一次';});}
  function start(){clearInterval(timer);timer=setInterval(function(){if(!document.hidden)refresh();},90000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&keys)refresh();});}

  keys=load(LS)||load(LS_SHARED);
  if(!keys){lockView();return;}
  app.innerHTML='<p class="note" style="text-align:center;margin-top:30vh">讀取中…</p>';
  fetchBox().then(function(bx){
    if(keys.salt!==bx.kdf.salt){keys=null;lockView();return;}
    return open(bx,keys).then(function(d){data=d;render();start();});
  }).catch(function(e){keys=null;lockView(String(e.message)==='bad'?'記住的密碼已經換過，請重新輸入':'');});
})();
</script>
</body>
</html>
