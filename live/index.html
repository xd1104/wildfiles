<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- ⛔ 不要用 black-translucent：iPhone 主畫面 App 會讓底部約一個狀態列高的區域畫不上去（分頁列浮起、文字被切），10-02 踩過三輪 -->
<meta name="apple-mobile-web-app-title" content="荒野數據">
<link rel="apple-touch-icon" href="../avatar.jpg">
<title>荒野檔案 即時數據</title>
<style>
:root{
  --ground:#0E1216;--surface:#161B21;--surface2:#1D232A;--line:#29313A;
  --text:#EEF0F2;--muted:#8C949D;--faint:#5B636C;--accent:#FFD23F;--ink:#1A1600;
  --ok:#5CC98A;--warn:#FF9F43;--bad:#FF5F55;
  --yt:#FF5F55;--tt:#3DD6D0;--ig:#D774C0;--fb:#5E8EF0;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* ↑ iPhone 從主畫面打開（black-translucent）時，100%／bottom:0 都會少掉一個狀態列的高度，分頁列浮在半空、底下一段空白
     ⇒ 用 JS 讀 window.innerHeight（這時是對的）寫進 --app-h（2026-10-02） */
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,.topic:focus-visible,.hk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
.wrap{max-width:560px;margin:0 auto}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.top{display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.top img{width:40px;height:40px;border-radius:50%}
.top b{display:block;font-size:18px;letter-spacing:.04em;line-height:1.15}
.top small{color:var(--accent);font-family:var(--num);letter-spacing:.22em;font-weight:600;font-size:12px}
.top .re{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.todo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;width:100%;text-align:left;cursor:pointer}
.todo.hot{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.todo i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.todo.hot i{background:var(--ink)}
.todo span.go{margin-left:auto;font-size:13px;opacity:.75}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.warn i{background:var(--warn)} .status.bad i{background:var(--bad)}
.status.bad{color:var(--bad)}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:26px 0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:42px;line-height:1.05;margin-top:4px}
.stat .d{font-size:13px;color:var(--muted)}
.up{color:var(--ok)}
.pf{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.pf .nm{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.pf .c{text-align:right}
.pf .c .n{font-size:21px}
.pf .c small{display:block;font-size:11px;color:var(--muted)}
.pf .off{grid-column:2/4;text-align:right;font-size:12px;color:var(--faint)}
.pf .err{grid-column:1/4;font-size:12px;color:var(--bad)}
.chart{background:var(--surface);border-radius:12px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.vid{padding:12px 0;border-top:1px solid var(--line)}
.vid .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.no{font-family:var(--num);color:var(--accent);font-weight:600;margin-right:6px}
.vid .tot{font-size:26px}
.vid .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:4px 12px;flex-wrap:wrap}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.note{font-size:12px;color:var(--faint);margin-top:18px}
.pnote{font-size:13px;color:var(--muted)}
/* 選題 */
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk b{font-size:20px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.topic{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;position:relative}
.topic.on{border-color:var(--accent);background:var(--surface2)}
.topic.dim{opacity:.45}
.topic .hd{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.topic .rank{font-family:var(--num);font-size:13px;color:var(--muted);font-weight:600}
.topic .tt{font-size:17px;font-weight:700;margin:2px 36px 6px 0;line-height:1.35}
.topic .why{font-size:13px;color:var(--muted)}
.topic .facts{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.topic .tick{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:14px;font-weight:700}
.topic.on .tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.hooks{display:grid;gap:8px;margin-top:10px}
.hooks .lab{font-size:12px;color:var(--muted)}
.hk{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);cursor:pointer;font-size:15px;line-height:1.4}
.hk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hk.static{cursor:default}
.warnf{color:var(--warn)}
/* 審片 */
.rv{background:var(--surface);border-radius:14px;padding:12px;margin-top:12px}
.rv .player{aspect-ratio:9/16;max-height:68vh;width:100%;background:#000;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.rv video{width:100%;height:100%;object-fit:contain;display:block}
.rv .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:12px 2px 4px}
.rv .head b{font-size:17px;line-height:1.35}
.rv .slot{font-size:13px;color:var(--accent);white-space:nowrap}
.rv .qa{font-size:13px;color:var(--muted);margin:6px 2px}
.rv details{margin:8px 2px;font-size:13px;color:var(--muted)}
.rv details summary{cursor:pointer;color:var(--text)}
.rv details pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{flex:1}
.rv textarea{width:100%;min-height:90px;margin-top:10px;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px}
.links{display:flex;gap:10px;font-size:12px;margin-top:2px}
.links a{color:var(--muted)}
.sent{margin-top:10px;font-size:13px;color:var(--ok)}
.sent.err{color:var(--bad)}
/* 送出列與分頁列 */
.sticky{flex:none;padding:10px 16px;background:var(--ground);border-top:1px solid var(--line)}
.sticky .wrap{display:flex;gap:10px;align-items:center}
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:2px 0 max(6px,env(safe-area-inset-bottom,0px))}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.tab .ic{position:relative;width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab[aria-selected="true"] .ic{background:rgba(255,210,63,.16)}
.tab .badge{position:absolute;top:-4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;line-height:18px;font-family:var(--num)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* 鎖 */
.lock{max-width:360px;margin:12vh auto 0;text-align:center;padding:0 16px}
.lock img{width:84px;height:84px;border-radius:50%;margin-bottom:14px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;text-align:center}
.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.lock button:disabled{opacity:.5}
.lock .msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="scroll" id="scroller"><div class="wrap" id="app"></div></div>
<div class="sticky" id="pickBar" hidden><div class="wrap"><span class="pnote" id="pickCount"></span><button class="btn primary wide" id="pickSubmit" type="button" disabled>送出</button></div></div>
<nav class="tabs" id="tabs" role="tablist" hidden><div class="wrap">
  <button class="tab" role="tab" data-v="data" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>數據</button>
  <button class="tab" role="tab" data-v="topics" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="bTopics" hidden></span></span>選題</button>
  <button class="tab" role="tab" data-v="review" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2.5v9L17 14"/></svg><span class="badge" id="bReview" hidden></span></span>審片</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){function fit(){var h=window.innerHeight;
    document.documentElement.style.setProperty('--app-h',h+'px');window.__appH=h;}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);document.addEventListener('visibilitychange',fit);})();
(function () {
  'use strict';
  /* 荒野數據（2026-10-02 起把原本 claude.ai 控制台的選題、審片併進來）
     讀：stats 分支的 stats.json（四平台數據）、work.json（製作進度）；media 分支的 epNN.bin（預覽片，AES-GCM）
     寫：Benson 按的挑題／審片 ⇒ 加密成封包 ⇒ 用 live/wtoken.json 裡（加密過）的寫入金鑰放進 inbox 分支
         ⇒ 電腦每 30 分鐘的 live_stats.py 收進來（animal-shorts/live/work.py）
     解密跟 animal-shorts/live/wfcrypto.py（＝交易手機監控同一套）：PBKDF2 ⇒ k_enc‖k_mac；HMAC 金鑰流；影片鑰匙 = HMAC(k_enc,"wfvideo1") */
  var REPO = 'xd1104/wildfiles';
  var API = function (p, ref) { return 'https://api.github.com/repos/' + REPO + '/contents/' + p + '?ref=' + ref; };
  var RAW = function (p, ref) { return 'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/' + p; };
  var LS = 'wfl.key.v1', LS_SHARED = 'tlmon.key.v1', LS_TAB = 'wfl.tab', LS_PEND = 'wfl.pending', LS_PICK = 'wfl.picks.';
  var MAGIC = new TextEncoder().encode('tlmon1');
  var PF = [{k:'yt',n:'YouTube',c:'var(--yt)'},{k:'tt',n:'TikTok',c:'var(--tt)'},{k:'ig',n:'Instagram',c:'var(--ig)'},{k:'fb',n:'Facebook',c:'var(--fb)'}];
  var $ = function (id) { return document.getElementById(id); };
  var S = { keys:null, stats:null, statsT:0, work:null, token:null, tokenState:'?', tab:'data', picks:{}, editing:{}, videoUrl:{}, busy:false };
  var etags = {};

  /* ── bytes / crypto ── */
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function ub64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
  function cat(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length;}return o;}
  function eq(a,b){if(a.length!==b.length)return false;var d=0;for(var i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}
  function derive(pw,salt,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,512);})
    .then(function(bits){var u=new Uint8Array(bits);return {salt:ub64(salt),iter:iter,enc:u.slice(0,32),mac:u.slice(32)};});}
  function hk(raw){return crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign']);}
  function hm(key,d){return crypto.subtle.sign('HMAC',key,d).then(function(s){return new Uint8Array(s);});}
  function stream(kEnc,nonce,n){return hk(kEnc).then(function(h){var jobs=[];for(var i=0;i<Math.ceil(n/32);i++)jobs.push(hm(h,cat(nonce,new Uint8Array([(i>>>24)&255,(i>>>16)&255,(i>>>8)&255,i&255]))));
    return Promise.all(jobs).then(function(bl){return cat.apply(null,bl).subarray(0,n);});});}
  function open(bx,k){var nonce=b64(bx.nonce),ct=b64(bx.ct),tag=b64(bx.tag),t=new TextEncoder().encode(String(bx.t));
    return hk(k.mac).then(function(h){return hm(h,cat(MAGIC,t,nonce,ct));}).then(function(want){
      if(!eq(want,tag))throw new Error('bad');
      return stream(k.enc,nonce,ct.length).then(function(ks){var pt=new Uint8Array(ct.length);for(var j=0;j<ct.length;j++)pt[j]=ct[j]^ks[j];return JSON.parse(new TextDecoder().decode(pt));});});}
  function seal(obj,k){var t=String(Math.floor(Date.now()/1000)),pt=new TextEncoder().encode(JSON.stringify(obj)),nonce=crypto.getRandomValues(new Uint8Array(16));
    return stream(k.enc,nonce,pt.length).then(function(ks){var ct=new Uint8Array(pt.length);for(var j=0;j<pt.length;j++)ct[j]=pt[j]^ks[j];
      return hk(k.mac).then(function(h){return hm(h,cat(MAGIC,new TextEncoder().encode(t),nonce,ct));}).then(function(tag){
        return {v:1,t:+t,kdf:{alg:'PBKDF2-SHA256',iter:k.iter,salt:k.salt},nonce:ub64(nonce),ct:ub64(ct),tag:ub64(tag)};});});}
  function videoKey(k){return hk(k.enc).then(function(h){return hm(h,new TextEncoder().encode('wfvideo1'));})
    .then(function(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);});}
  function loadKeys(name){try{var o=JSON.parse(localStorage.getItem(name)||'null');if(!o)return null;return {salt:o.salt,iter:o.iter,enc:b64(o.enc),mac:b64(o.mac)};}catch(e){return null;}}
  function saveKeys(k){try{localStorage.setItem(LS,JSON.stringify({salt:k.salt,iter:k.iter,enc:ub64(k.enc),mac:ub64(k.mac)}));}catch(e){}}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  /* ── 讀 ── */
  function getBox(path,ref){var h={'Accept':'application/vnd.github.raw'},key=ref+':'+path;if(etags[key])h['If-None-Match']=etags[key].tag;
    return fetch(API(path,ref),{headers:h,cache:'no-store'}).then(function(r){
      if(r.status===304&&etags[key])return etags[key].box;if(r.status===404)return null;if(!r.ok)throw new Error('api '+r.status);
      var tag=r.headers.get('ETag');return r.json().then(function(b){if(tag)etags[key]={tag:tag,box:b};return b;});})
    .catch(function(e){if(e&&e.message==='bad')throw e;return fetch(RAW(path,ref)+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('raw '+r.status);return r.json();});});}
  function loadAll(){return Promise.all([getBox('stats.json','stats'),getBox('work.json','stats')]).then(function(r){
      if(!r[0])throw new Error('nodata');
      return Promise.all([open(r[0],S.keys),r[1]?open(r[1],S.keys):null]).then(function(d){S.stats=d[0];S.statsT=r[0].t;S.work=d[1]||{videos:{}};});});}
  function loadToken(){if(S.token)return Promise.resolve(S.token);
    return fetch('wtoken.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok){S.tokenState='none';return null;}return r.json();})
      .then(function(bx){if(!bx)return null;return open(bx,S.keys).then(function(o){S.token=o.token;S.tokenState='ok';return o.token;});})
      .catch(function(){S.tokenState='none';return null;});}

  /* ── 寫：動作放進 inbox 分支 ── */
  function send(action){
    if(S.busy)return Promise.reject(new Error('busy'));S.busy=true;
    action.id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);action.at=new Date().toISOString();
    return loadToken().then(function(tok){if(!tok)throw new Error('notoken');return seal(action,S.keys).then(function(box){
      var body={message:'inbox '+action.type,branch:'inbox',content:ub64(new TextEncoder().encode(JSON.stringify(box)))};
      return fetch('https://api.github.com/repos/'+REPO+'/contents/inbox/'+action.id+'.json',{method:'PUT',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});});})
    .then(function(r){if(!r.ok)throw new Error('put '+r.status);var p=lsGet(LS_PEND,{});p[action.id]=action;lsSet(LS_PEND,p);S.busy=false;return action;})
    .catch(function(e){S.busy=false;throw e;});}
  function pending(){var p=lsGet(LS_PEND,{}),acks=(S.work&&S.work.acks)||{},out=[],changed=false;
    for(var id in p){if(acks[id]){delete p[id];changed=true;}else if(Date.now()-new Date(p[id].at).getTime()>3*86400e3){delete p[id];changed=true;}else out.push(p[id]);}
    if(changed)lsSet(LS_PEND,p);return out;}

  function sumAt(h,key){var s=0,any=false;for(var p in (h[key]||{})){if(h[key][p]!=null){s+=h[key][p];any=true;}}return any?s:null;}
  function past(hist,hours){var cut=Date.now()-hours*3600e3,best=null;for(var i=0;i<hist.length;i++){if(new Date(hist[i].at).getTime()<=cut)best=hist[i];}return best;}
  function dataView(){

      h+='</div>';});
    h+='<h2>最近 3 天總觀看</h2>'+chart(hist)+'<h2>每支片</h2>'+videos(d,h24);
    h+='<p class="note">版本 10-02d・畫面高 '+(window.__appH||'?')+'・'+(window.navigator.standalone?'主畫面':'瀏覽器')+'</p>';
    h+='<p class="note">YouTube 公開觀看數比後台慢幾個小時，有「後台」字樣的是每天早上從 YouTube 後台讀的。FB 的觀看是 Reels 播放次數。</p>';

  function chart(hist){
    var cut=Date.now()-72*3600e3,pts=hist.filter(function(x){return new Date(x.at).getTime()>=cut;}).map(function(x){return {t:new Date(x.at).getTime(),v:sumAt(x,'v')};}).filter(function(p){return p.v!=null;});
    if(pts.length<2)return '<div class="empty">累積幾次更新後，這裡會畫出觀看數的變化。</div>';
    var W=340,H=150,l=40,r=8,t=10,b=22,iw=W-l-r,ih=H-t-b,t0=pts[0].t,t1=pts[pts.length-1].t,lo=pts[0].v,hi=pts[0].v;
    for(var i=0;i<pts.length;i++){lo=Math.min(lo,pts[i].v);hi=Math.max(hi,pts[i].v);}
    if(hi===lo)hi=lo+1;var X=function(tt){return l+(t1===t0?iw:(tt-t0)/(t1-t0)*iw);},Y=function(v){return t+ih-(v-lo)/(hi-lo)*ih;};
    var d='';pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);});
    var a=d+'L'+X(t1).toFixed(1)+' '+(t+ih)+'L'+X(t0).toFixed(1)+' '+(t+ih)+'Z',last=pts[pts.length-1];
    var g='<path d="'+a+'" fill="rgba(255,210,63,.12)"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="'+X(last.t)+'" cy="'+Y(last.v)+'" r="3.5" fill="var(--accent)"/>';
    [lo,hi].forEach(function(v){g+='<text x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(v)+'</text>';});
    var lab=function(tt,anc){var dd=new Date(tt);return '<text x="'+X(tt)+'" y="'+(H-6)+'" text-anchor="'+anc+'" font-size="10" fill="var(--muted)">'+(dd.getMonth()+1)+'/'+dd.getDate()+' '+String(dd.getHours()).padStart(2,'0')+':'+String(dd.getMinutes()).padStart(2,'0')+'</text>';};
    g+=lab(t0,'start')+lab(t1,'end');
    return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近 3 天總觀看">'+g+'</svg></div>';
  }
  function videos(d,h24){
    var rows={};PF.forEach(function(p){var x=d.platforms[p.k];if(!x||!x.ok)return;(x.videos||[]).forEach(function(v){
      var key=v.ep||(p.k+':'+v.id),r=rows[key]||(rows[key]={ep:v.ep,title:(v.ep&&d.episodes&&d.episodes[v.ep]&&d.episodes[v.ep].title)||v.title,per:{},watch:{},likes:0,comments:0});
      r.per[p.k]=v.views;if(v.avgWatchSec!=null)r.watch[p.k]=v.avgWatchSec;r.likes+=v.likes||0;r.comments+=v.comments||0;
      if(p.k==='yt'){r.yt=v;}});});
    var list=Object.keys(rows).map(function(k){var r=rows[k];r.tot=0;for(var p in r.per)r.tot+=r.per[p];

      return '<div class="vid"><div class="h"><span>'+(no?'<span class="no">'+no2(no)+'</span>':'')+esc(r.title)+'</span><span class="tot n">'+fmt(r.tot)+'</span></div>'+

        '<span>讚 '+fmt(r.likes)+'</span><span>留言 '+fmt(r.comments)+'</span>'+(r.d24!=null?'<span>24 小時 '+plus(r.d24)+'</span>':'')+'</div>'+
        (extra.length?'<div class="m">'+extra.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>':'')+'</div>';}).join('');

  function bindReview(){
    document.querySelectorAll('[data-play]').forEach(function(b){b.addEventListener('click',function(){play(b.dataset.play,b);});});
    document.querySelectorAll('[data-ok]').forEach(function(b){b.addEventListener('click',function(){decide(b.dataset.ok,'approved');});});
    document.querySelectorAll('[data-fix]').forEach(function(b){b.addEventListener('click',function(){S.editing[b.dataset.fix]=1;render();var t=$('note-'+b.dataset.fix);t&&t.focus();});});
    document.querySelectorAll('[data-cancel]').forEach(function(b){b.addEventListener('click',function(){delete S.editing[b.dataset.cancel];render();});});
    document.querySelectorAll('[data-send]').forEach(function(b){b.addEventListener('click',function(){var e=b.dataset.send,n=$('note-'+e).value.trim();if(!n){toast('寫一下要改哪裡');return;}decide(e,'revise',n);});});
    document.querySelectorAll('[data-undo]').forEach(function(b){b.addEventListener('click',function(){decide(b.dataset.undo,'review');});});
    document.querySelectorAll('textarea[id^="note-"]').forEach(function(t){t.addEventListener('input',function(){lsSet('wfl.note.'+t.id.slice(5),t.value);});});
  }
  function play(e,btn){var v=S.work.videos[e];btn.disabled=true;btn.textContent='下載中…';
    Promise.all([fetch(RAW(v.preview.file,'media')+'?v='+v.preview.v).then(function(r){if(!r.ok)throw new Error('dl '+r.status);return r.arrayBuffer();}),videoKey(S.keys)])
      .then(function(x){var u=new Uint8Array(x[0]);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},x[1],u.subarray(12));})
      .then(function(pt){S.videoUrl[e]=URL.createObjectURL(new Blob([pt],{type:'video/mp4'}));render();})
      .catch(function(){btn.disabled=false;btn.textContent='沒載入成功，再按一次';});}
  function decide(e,dec,note){
    send({type:'review',ep:e,decision:dec,note:note||''}).then(function(){delete S.editing[e];try{localStorage.removeItem('wfl.note.'+e);}catch(x){}
      toast(dec==='approved'?'收到，電腦收到後就會排程':dec==='revise'?'收到，會照你的意見修改':'已改回待審');render();})
      .catch(function(err){toast(sendErr(err));});}

  /* ── 開機 ── */
  function refresh(){var b=$('re');if(b)b.textContent='更新中…';return loadAll().then(render).catch(function(){if(b)b.textContent='沒連上，再按一次';});}
  var timer=null;
  function boot(){return loadAll().then(function(){
    $('tabs').hidden=false;var t=lsGet(LS_TAB,'data');setTab(['data','topics','review'].indexOf(t)>=0?t:'data');loadToken();
    clearInterval(timer);timer=setInterval(function(){if(!document.hidden)refresh();},90000);});}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.keys&&S.stats)refresh();});

  S.keys=loadKeys(LS)||loadKeys(LS_SHARED);
  if(!S.keys){lockView();return;}
  $('app').innerHTML='<p class="note" style="text-align:center;margin-top:30vh">讀取中…</p>';
  getBox('stats.json','stats').then(function(bx){if(!bx||S.keys.salt!==bx.kdf.salt){S.keys=null;lockView();return;}return boot();})
    .catch(function(e){S.keys=null;lockView(String(e.message)==='bad'?'記住的密碼已經換過，請重新輸入':'');});
})();
</script>
