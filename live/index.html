<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- ⛔ 不要用 black-translucent：iPhone 主畫面 App 會讓底部約一個狀態列高的區域畫不上去（分頁列浮起、文字被切），10-02 踩過三輪 -->
<meta name="apple-mobile-web-app-title" content="荒野數據">
<link rel="apple-touch-icon" href="../avatar.jpg">
<link rel="manifest" href="manifest.webmanifest">
<title>荒野數據</title>
<style>
:root{
  --ground:#0E1216;--surface:#161B21;--surface2:#1D232A;--line:#29313A;
  --text:#EEF0F2;--muted:#8C949D;--faint:#5B636C;--accent:#FFD23F;--ink:#1A1600;
  --ok:#5CC98A;--warn:#FF9F43;--bad:#FF5F55;
  --yt:#FF5F55;--tt:#3DD6D0;--ig:#D774C0;--fb:#5E8EF0;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* ↑ iPhone 從主畫面打開（black-translucent）時，100%／bottom:0 都會少掉一個狀態列的高度，分頁列浮在半空、底下一段空白
     ⇒ 用 JS 讀 window.innerHeight（這時是對的）寫進 --app-h（2026-10-02） */
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,.topic:focus-visible,.hk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
.wrap{max-width:560px;margin:0 auto}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.top{display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.top img{width:40px;height:40px;border-radius:50%}
.top b{display:block;font-size:18px;letter-spacing:.04em;line-height:1.15}
.top small{color:var(--accent);font-family:var(--num);letter-spacing:.22em;font-weight:600;font-size:12px}
.top .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--ink);font-weight:800;font-size:18px;flex:none}
.chs{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.chip[aria-pressed="true"] .dot{background:var(--ink)}
.chip small{font-size:11px;opacity:.7}
.top .re{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.todo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;width:100%;text-align:left;cursor:pointer}
.todo.hot{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.todo i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.todo.hot i{background:var(--ink)}
.todo span.go{margin-left:auto;font-size:13px;opacity:.75}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.warn i{background:var(--warn)} .status.bad i{background:var(--bad)}
.status.bad{color:var(--bad)}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:26px 0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:42px;line-height:1.05;margin-top:4px}
.stat .d{font-size:13px;color:var(--muted)}
.up{color:var(--ok)}
.pf{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.pf .nm{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.pf .c{text-align:right}
.pf .c .n{font-size:21px}
.pf .c small{display:block;font-size:11px;color:var(--muted)}
.pf .off{grid-column:2/4;text-align:right;font-size:12px;color:var(--faint)}
.pf .err{grid-column:1/4;font-size:12px;color:var(--bad)}
.chart{background:var(--surface);border-radius:12px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
/* 每支片（10-05 改版：Benson 嫌原本一串文字很亂 ⇒ 卡片＋四平台格子＋比例條） */
.vid{background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.vid .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.vid .tt{font-size:15px;font-weight:700;line-height:1.4;min-width:0}
.vid .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.vid .tot{text-align:right;flex:none}
.vid .tot .n{display:block;font-size:30px;line-height:1.05}
.vid .tot small{font-size:12px;color:var(--muted)}
.no{font-family:var(--num);color:var(--accent);font-weight:600;margin-right:6px}
.vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:12px 0 10px;background:var(--surface2)}
.vbar i{display:block;height:100%}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vcell{background:var(--ground);border-radius:10px;padding:8px 8px 7px;min-width:0}
.vcell .pn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.vcell .pn .sw{width:7px;height:7px;border-radius:50%}
.vcell .pv{font-size:20px;line-height:1.25;margin-top:3px}
.vcell .ps{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcell.off .pv{color:var(--faint)}
.vcell .spk{display:block;width:100%;height:26px;margin-top:4px}
.vcell .g .up{color:#4ade80}
.vcell .g .stop{color:var(--faint)}
.ckey{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--muted);margin-top:4px}
.ckey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.vfoot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.vfoot b{color:var(--text);font-weight:600;font-family:var(--num)}
.pushc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);margin:-4px 0 14px;font-size:13px;color:var(--muted)}
.pushc b{display:block;color:var(--text);font-size:14px;margin-bottom:1px}
.pushc .btn{flex:none;padding:9px 14px;font-size:14px}
.pushc .err{color:var(--warn)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.note{font-size:12px;color:var(--faint);margin-top:18px}
.pnote{font-size:13px;color:var(--muted)}
/* 選題 */
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk b{font-size:20px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.topic{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;position:relative}
.topic.on{border-color:var(--accent);background:var(--surface2)}
.topic.dim{opacity:.45}
.topic .hd{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.topic .rank{font-family:var(--num);font-size:13px;color:var(--muted);font-weight:600}
.topic .tt{font-size:17px;font-weight:700;margin:2px 36px 6px 0;line-height:1.35}
.topic .why{font-size:13px;color:var(--muted)}
.topic .facts{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.topic .tick{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:14px;font-weight:700}
.topic.on .tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.hooks{display:grid;gap:8px;margin-top:10px}
.hooks .lab{font-size:12px;color:var(--muted)}
.hk{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);cursor:pointer;font-size:15px;line-height:1.4}
.hk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hk.static{cursor:default}
.warnf{color:var(--warn)}
/* 審片 */
.rv{background:var(--surface);border-radius:14px;padding:12px;margin-top:12px}
.rv .player{aspect-ratio:9/16;max-height:68vh;width:100%;background:#000;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.rv video{width:100%;height:100%;object-fit:contain;display:block}
.rv .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:12px 2px 4px}
.rv .head b{font-size:17px;line-height:1.35}
.rv .slot{font-size:13px;color:var(--accent);white-space:nowrap}
.rv .qa{font-size:13px;color:var(--muted);margin:6px 2px}
.rv details{margin:8px 2px;font-size:13px;color:var(--muted)}
.rv details summary{cursor:pointer;color:var(--text)}
.rv details pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{flex:1}
/* 修改意見：整頁蓋上來的輸入頁，高度跟著「鍵盤以外看得到的範圍」（visualViewport），字不會被鍵盤擋住；字級 ≥16px，iPhone 才不會自動放大畫面（10-04 Benson：輸入時很醜、看不到自己打的字） */
.sheet{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100%);z-index:50;background:var(--ground);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.sheet[hidden]{display:none}
.sh-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-top b{flex:1;min-width:0;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-top .btn{padding:9px 14px}
.sh-hint{font-size:13px;color:var(--muted);margin:0 2px 8px}
#shText{flex:1;min-height:96px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6;resize:none;color:var(--text)}
#shText::placeholder{color:var(--faint)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px}
.qlink{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;font-size:14px}
.qlink small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qlink i{font-style:normal;color:var(--accent);font-size:22px;line-height:1}
/* 10-06c 工作進度（state.plan）：每支片一列＋步驟點 */
.plan{padding:12px 0;border-top:1px solid var(--line)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.plan .ph small{color:var(--muted);font-size:12px;white-space:nowrap}
.steps{display:flex;gap:4px;margin-top:8px}
.steps span{flex:1;min-width:0;font-size:11px;text-align:center;color:var(--faint);padding-top:8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps span::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:2px;background:var(--line)}
.steps span.done{color:var(--muted)} .steps span.done::before{background:var(--ok)}
.steps span.doing{color:var(--text);font-weight:700} .steps span.doing::before{background:var(--accent)}
.plan .pn{font-size:12px;color:var(--muted);margin-top:6px}
.links{display:flex;gap:10px;font-size:12px;margin-top:2px}
.links a{color:var(--muted)}
.links .q{color:var(--muted);opacity:.6}
.sent{margin-top:10px;font-size:13px;color:var(--ok)}
.sent.err{color:var(--bad)}
/* 送出列與分頁列 */
.sticky{flex:none;padding:10px 16px;background:var(--ground);border-top:1px solid var(--line)}
.sticky .wrap{display:flex;gap:10px;align-items:center}
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:2px 0 max(6px,env(safe-area-inset-bottom,0px))}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.tab .ic{position:relative;width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab[aria-selected="true"] .ic{background:rgba(255,210,63,.16)}
.tab .badge{position:absolute;top:-4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;line-height:18px;font-family:var(--num)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* 鎖 */
.lock{max-width:360px;margin:12vh auto 0;text-align:center;padding:0 16px}
.lock img{width:84px;height:84px;border-radius:50%;margin-bottom:14px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;text-align:center}
.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.lock button:disabled{opacity:.5}
.lock .msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="scroll" id="scroller"><div class="wrap" id="app"></div></div>
<div class="sticky" id="pickBar" hidden><div class="wrap"><span class="pnote" id="pickCount"></span><button class="btn primary wide" id="pickSubmit" type="button" disabled>送出</button></div></div>
<nav class="tabs" id="tabs" role="tablist" hidden><div class="wrap">
  <button class="tab" role="tab" data-v="data" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>數據</button>
  <button class="tab" role="tab" data-v="topics" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="bTopics" hidden></span></span>選題</button>
  <button class="tab" role="tab" data-v="review" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2.5v9L17 14"/></svg><span class="badge" id="bReview" hidden></span></span>審片</button>
</div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sh-top"><button class="btn" id="shCancel" type="button">取消</button><b id="shTitle"></b><button class="btn primary" id="shSend" type="button">送出</button></div>
  <p class="sh-hint">寫下要改哪裡，送出後會照你的意見重做。</p>
  <textarea id="shText" placeholder="例如：開頭那句太慢、第 20 秒的畫面不是這種動物…"></textarea>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){function fit(){var h=window.innerHeight,r=document.documentElement.style,vv=window.visualViewport;
    r.setProperty('--app-h',h+'px');window.__appH=h;
    r.setProperty('--vv-h',(vv?vv.height:h)+'px');r.setProperty('--vv-top',(vv?vv.offsetTop:0)+'px');}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);window.visualViewport.addEventListener('scroll',fit);}document.addEventListener('visibilitychange',fit);})();
(function () {
  'use strict';
  /* 荒野數據（2026-10-02 起把原本 claude.ai 控制台的選題、審片併進來）
     讀：stats 分支的 stats.json（四平台數據）、work.json（製作進度）；media 分支的 epNN.bin（預覽片，AES-GCM）
     10-05c 多頻道：stats.json 裡的 channels 是頻道清單；荒野檔案用 stats.json／work.json，其他頻道用 stats-<id>.json／work-<id>.json；
       上方頻道按鈕切換，挑題／審片的動作帶 ch（沒帶＝荒野檔案，對應 animal-shorts/channels.json）
     寫：Benson 按的挑題／審片 ⇒ 加密成封包 ⇒ 用 live/wtoken.json 裡（加密過）的寫入金鑰放進 inbox 分支
         ⇒ 電腦每 10 分鐘的 live_stats.py 收進來（animal-shorts/live/work.py）
     解密跟 animal-shorts/live/wfcrypto.py（＝交易手機監控同一套）：PBKDF2 ⇒ k_enc‖k_mac；HMAC 金鑰流；影片鑰匙 = HMAC(k_enc,"wfvideo1") */
  var REPO = 'xd1104/wildfiles';
  var API = function (p, ref) { return 'https://api.github.com/repos/' + REPO + '/contents/' + p + '?ref=' + ref; };
  var RAW = function (p, ref) { return 'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/' + p; };
  var LS = 'wfl.key.v1', LS_SHARED = 'tlmon.key.v1', LS_TAB = 'wfl.tab', LS_PEND = 'wfl.pending', LS_PICK = 'wfl.picks.';
  var MAGIC = new TextEncoder().encode('tlmon1');
  var PF = [{k:'yt',n:'YouTube',c:'var(--yt)'},{k:'tt',n:'TikTok',c:'var(--tt)'},{k:'ig',n:'Instagram',c:'var(--ig)'},{k:'fb',n:'Facebook',c:'var(--fb)'}];
  var $ = function (id) { return document.getElementById(id); };
  var LS_CH='wfl.ch',DEF='wildfiles';
  var S = { keys:null, stats:null, statsT:0, work:null, token:null, tokenState:'?', tab:'data', picks:{}, videoUrl:{}, busy:false, ch:DEF, chans:[], all:{} };
  var etags = {};

  /* ── bytes / crypto ── */

  /* ── 寫：動作放進 inbox 分支 ── */
  function send(action){

    return loadToken().then(function(tok){if(!tok)throw new Error('notoken');return seal(action,S.keys).then(function(box){

    .then(function(r){if(!r.ok)throw new Error('put '+r.status);var p=lsGet(LS_PEND,{});p[action.id]=action;lsSet(LS_PEND,p);S.busy=false;return action;})

  function chart(hist){
    /* 10-06b2：Benson 嫌累積曲線怪（Y 軸從 3 千多開始、看不出現在還有沒有在漲）⇒ 改成每小時新增觀看，各平台堆疊 */
    var now=Date.now(),cut=now-72*3600e3,pts=hist.filter(function(x){return new Date(x.at).getTime()>=cut-3600e3;});
    if(pts.length<3)return '<div class="empty">累積幾次更新後，這裡會畫出每小時新增的觀看。</div>';
    var H0=Math.floor(cut/3600e3),N=72,bins=[];for(var i=0;i<N;i++){bins.push({});}
    for(var j=1;j<pts.length;j++){var a0=pts[j-1],a1=pts[j],tt=new Date(a1.at).getTime(),bi=Math.floor(tt/3600e3)-H0-1;if(bi<0||bi>=N)continue;
      PF.forEach(function(pp){var v0=a0.v&&a0.v[pp.k],v1=a1.v&&a1.v[pp.k];if(v0!=null&&v1!=null&&v1>v0)bins[bi][pp.k]=(bins[bi][pp.k]||0)+(v1-v0);});}
    var hi=1;bins.forEach(function(x){var s=0;for(var k in x)s+=x[k];hi=Math.max(hi,s);});
    var W=340,H=150,l=34,r=6,t=10,b=22,iw=W-l-r,ih=H-t-b,bw=iw/N,g='';
    bins.forEach(function(x,i){var y=t+ih;PF.forEach(function(pp){var v=x[pp.k];if(!v)return;var hh=v/hi*ih;y-=hh;g+='<rect x="'+(l+i*bw+0.4).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-0.8).toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+pp.c+'"/>';});});
    g+='<text x="'+(l-5)+'" y="'+(t+8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(hi)+'</text><text x="'+(l-5)+'" y="'+(t+ih)+'" text-anchor="end" font-size="10" fill="var(--muted)">0</text>';
    for(var dd=0;dd<=3;dd++){var tt=(H0+1)*3600e3+dd*24*3600e3;if(tt>now)break;var x=l+(tt/3600e3-H0-1)*bw,D=new Date(tt);
      g+='<line x1="'+x.toFixed(1)+'" y1="'+t+'" x2="'+x.toFixed(1)+'" y2="'+(t+ih)+'" stroke="var(--line)" stroke-dasharray="2 3"/><text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+(D.getMonth()+1)+'/'+D.getDate()+' '+String(D.getHours()).padStart(2,'0')+'時</text>';}
    var key=PF.map(function(pp){return '<span><i style="background:'+pp.c+'"></i>'+({ig:'IG',fb:'FB'}[pp.k]||pp.n)+'</span>';}).join('');
    return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近 3 天每小時新增觀看">'+g+'</svg><div class="ckey">'+key+'</div></div>';
  }
  /* 每支片每個平台：從發片開始的累積觀看小曲線＋近 3 小時增加（0＝平台停止推了） */
  function spark(hist,ep,k,slotT,color){
    var pts=[];hist.forEach(function(x){var tt=new Date(x.at).getTime();if(slotT&&tt<slotT)return;var e=x.e&&x.e[ep];if(e&&e[k]!=null)pts.push({t:tt,v:e[k]});});
    if(pts.length<2)return {svg:'',d3:null};
    var W=100,H=26,t0=slotT||pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+1),hi=1;pts.forEach(function(p){hi=Math.max(hi,p.v);});
    var X=function(tt){return (tt-t0)/(t1-t0)*W;},Y=function(v){return H-1-v/hi*(H-3);},d='';
    pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);});
    var last=pts[pts.length-1],ref=null;for(var i=pts.length-1;i>=0;i--){if(pts[i].t<=last.t-3*3600e3){ref=pts[i];break;}}
    return {svg:'<svg class="spk" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>',d3:ref?last.v-ref.v:null};
  }

        return '<div class="vcell'+(v==null?' off':'')+'"><div class="pn"><span class="sw" style="background:'+p.c+'"></span>'+({ig:'IG',fb:'FB'}[p.k]||p.n)+'</div>'+

        '<div class="vfoot">'+foot.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></div>';}).join('');

  S.keys=loadKeys(LS)||loadKeys(LS_SHARED);
  if(!S.keys){lockView();return;}
  $('app').innerHTML='<p class="note" style="text-align:center;margin-top:30vh">讀取中…</p>';
  getBox('stats.json','stats').then(function(bx){if(!bx||S.keys.salt!==bx.kdf.salt){S.keys=null;lockView();return;}return boot();})
    .catch(function(e){S.keys=null;lockView(String(e.message)==='bad'?'記住的密碼已經換過，請重新輸入':'');});
})();
</script>
</body>
</html>
