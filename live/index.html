<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- ⛔ 不要用 black-translucent：iPhone 主畫面 App 會讓底部約一個狀態列高的區域畫不上去（分頁列浮起、文字被切），10-02 踩過三輪 -->
<meta name="apple-mobile-web-app-title" content="荒野數據">
<link rel="apple-touch-icon" href="../avatar.jpg">
<link rel="manifest" href="manifest.webmanifest">
<title>荒野數據</title>
<style>
:root{
  --ground:#0E1216;--surface:#161B21;--surface2:#1D232A;--line:#29313A;
  --text:#EEF0F2;--muted:#8C949D;--faint:#5B636C;--accent:#FFD23F;--ink:#1A1600;
  --ok:#5CC98A;--warn:#FF9F43;--bad:#FF5F55;
  --yt:#FF5F55;--tt:#3DD6D0;--ig:#D774C0;--fb:#5E8EF0;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* ↑ iPhone 從主畫面打開（black-translucent）時，100%／bottom:0 都會少掉一個狀態列的高度，分頁列浮在半空、底下一段空白
     ⇒ 用 JS 讀 window.innerHeight（這時是對的）寫進 --app-h（2026-10-02） */
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,.topic:focus-visible,.hk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
.wrap{max-width:560px;margin:0 auto}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
/* 10-07f 精簡版（照 work/data-research/ux-demo-slim.html，Benson：「可以，照這版改」）：390×844 第一屏要看得到 2～3 支片卡 */
/* 標題列：頭像＋頻道名＋右邊「● N 分鐘前」（按了＝重新整理；過久變紅） */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top img,.top .av{width:34px;height:34px;border-radius:50%;flex:none}
.top .av{display:grid;place-items:center;background:var(--accent);color:var(--ink);font-weight:800;font-size:16px}
.top b{font-size:18px;letter-spacing:.04em;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top b small{font-size:11px;color:var(--warn);font-weight:400;letter-spacing:0;margin-left:6px}
.top .st{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;font-size:13px;color:var(--muted);padding:8px 2px 8px 10px;min-height:40px;cursor:pointer}
.top .st i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.top .st.warn i{background:var(--warn)}
.top .st.bad{color:var(--bad)} .top .st.bad i{background:var(--bad)}
.chs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
.chs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.chip[aria-pressed="true"] .dot{background:var(--ink)}
.chip small{font-size:11px;opacity:.7}
/* 待辦：有事才出現 */
.todo{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.todo.hot{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.todo i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.todo.hot i{background:var(--ink)}
.todo span.go{margin-left:auto;font-size:13px;opacity:.75;font-weight:400}
/* 有事才出現的警示（電腦斷線、平台沒抓到、Meta 授權快到期） */
.alert{font-size:13px;color:var(--warn);margin:0 0 10px;line-height:1.5}
.alert.bad{color:var(--bad)}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:26px 0 10px}
h2.sh{margin:16px 0 2px;display:flex;align-items:center;gap:8px}
h2.sh .pill{font-size:11px;padding:1px 8px;letter-spacing:0}
.up{color:var(--ok)} .dn{color:var(--bad)}
/* 一行摘要（點開才看營利） */
.sum{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;font-size:14px;color:var(--muted);cursor:pointer;text-align:left}
.sum span.t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum b{color:var(--text);font-family:var(--num);font-weight:600;font-size:16px}
.sum em{margin-left:auto;font-style:normal;color:var(--faint);transition:transform .15s}
.sum[aria-expanded="true"] em{transform:rotate(90deg)}
.sumx{font-size:13px;color:var(--muted);padding:8px 2px 2px;line-height:1.6}
.sumx b{color:var(--text);font-weight:600}
.mile{display:flex;gap:4px;margin:6px 0 4px}
.mile span{flex:1;min-width:0;font-size:11px;text-align:center;color:var(--faint);padding-top:9px;position:relative;white-space:nowrap}
.mile span::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:3px;background:var(--line)}
.mile span.done{color:var(--muted)} .mile span.done::before{background:var(--ok)}
.mile span.doing{color:var(--text);font-weight:700}
.mile span.doing::after{content:"";position:absolute;top:0;left:0;width:var(--p,0%);height:5px;border-radius:3px;background:var(--accent)}
/* 片卡：三行 */
.vid{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:3px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:12px 12px 11px 14px;margin-top:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;align-items:center}
.vid:active{background:var(--surface2)}
.vid .tt{font-size:15px;font-weight:700;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no{font-family:var(--num);color:var(--accent);font-weight:600;margin-right:5px}
.new{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--ink);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px;line-height:17px}
.vid .vw{display:flex;align-items:baseline;gap:6px;justify-self:end}
.vid .vw .n{font-size:22px;line-height:1.1}
.vid .vw em{font-style:normal;color:var(--faint);font-size:20px;line-height:1}
.vid .vd{grid-column:1/3;display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45}
.vid .vd i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--faint)}
.vd.good i{background:var(--ok)} .vd.bad i{background:var(--bad)} .vd.mid i{background:var(--warn)}
.vid .ms{grid-column:1/3;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .ms b{color:var(--text);font-family:var(--num);font-weight:600;font-size:14px}
.vid .ms .sl{color:var(--warn)}
/* 最底下「更多」 */
details.more{margin-top:18px;border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;list-style:none;padding:12px 2px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";flex:none} details.more[open]>summary::after{content:"－"}
.mh{font-size:12px;color:var(--muted);margin:14px 0 6px}
.tip{font-size:13px;color:var(--muted);line-height:1.65}
.tip b{color:var(--text);font-weight:600}
.pushrow{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.pushrow .btn{flex:none;padding:8px 14px;font-size:14px}
.pushrow .err{color:var(--warn)}
.pf{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.pf .nm{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.pf .c{text-align:right}
.pf .c .n{font-size:19px}
.pf .c small{display:block;font-size:11px;color:var(--muted)}
.pf .off{grid-column:2/4;text-align:right;font-size:12px;color:var(--faint)}
.pf .err{grid-column:1/4;font-size:12px;color:var(--bad)}
.chart{background:var(--surface);border-radius:12px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.ckey{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.ckey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
/* 單支片的細節頁（整頁推進來） */
.detail{position:fixed;left:0;right:0;top:0;height:var(--app-h,100%);z-index:40;background:var(--ground);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);transform:translateX(0);transition:transform .22s ease-out}
.detail[hidden]{display:none}
.detail.enter{transform:translateX(100%)}
.dbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 4px;border-bottom:1px solid var(--line)}
.dbar .back{background:none;border:0;font-size:16px;color:var(--accent);padding:8px 10px;min-height:44px;cursor:pointer;flex:none}
.dbar b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .tocm{flex:none;background:none;border:1px solid var(--line);border-radius:999px;font-size:13px;padding:5px 11px;min-height:34px;cursor:pointer;color:var(--muted)}
.dscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 40px}
.verd{border-radius:14px;padding:13px 14px;margin-top:12px;background:var(--surface);border-left:4px solid var(--faint)}
.verd.good{border-left-color:var(--ok)} .verd.bad{border-left-color:var(--bad)} .verd.mid{border-left-color:var(--warn)}
.verd .t{font-size:17px;font-weight:700;line-height:1.4}
.verd .nx{font-size:14px;margin-top:6px;line-height:1.55}
.verd .nx b{color:var(--accent);margin-right:4px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);letter-spacing:.06em;margin:20px 0 8px}
.qbtn{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--faint);background:none;color:var(--muted);font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
.qtx{font-size:13px;color:var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.6}
.qtx[hidden]{display:none}
.dcard{background:var(--surface);border-radius:14px;padding:13px 14px;margin-top:8px}
.bars{display:grid;gap:14px}
.bar .l{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar .l span:last-child{white-space:nowrap}
.bar .tr{position:relative;height:10px;border-radius:5px;background:rgba(255,95,85,.35);margin-top:6px}
.bar .tr i{display:block;height:100%;border-radius:5px 0 0 5px;background:var(--ok)}
.bar .tr u{position:absolute;top:-4px;width:2px;height:18px;background:var(--text);border-radius:1px}
.bar.off .l{color:var(--faint)} .bar.off .l span:last-child{color:var(--warn);font-size:12px;white-space:normal;text-align:right}
.bar.off .tr{display:none}
.where{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,95,85,.16);color:var(--bad);margin-bottom:6px}
.where.mid{background:rgba(255,159,67,.16);color:var(--warn)}
.ret svg{display:block;width:100%;height:auto}
.ret .say{font-size:14px;margin:6px 0 0}
.dph{font-size:13px;color:var(--muted);margin:0}
.trf{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.6}
.trf b{color:var(--text);font-family:var(--num);font-weight:600}
details.fbret{margin-top:10px;border-top:1px solid var(--line)}
details.fbret>summary{cursor:pointer;list-style:none;font-size:13px;color:var(--muted);padding:10px 0 4px}
details.fbret>summary::-webkit-details-marker{display:none}
details.fbret>summary::before{content:"＋ "} details.fbret[open]>summary::before{content:"－ "}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vcell{background:var(--surface);border-radius:10px;padding:8px 8px 7px;min-width:0}
.vcell .pn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.vcell .pn .sw{width:7px;height:7px;border-radius:50%}
.vcell .pv{font-size:20px;line-height:1.25;margin-top:3px}
.vcell .ps{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcell.off .pv{color:var(--faint)}
.vcell.badc .pv{color:var(--faint);text-decoration:line-through}
.vcell .warnt{font-size:11px;color:var(--warn);line-height:1.3}
.vcell .spk{display:block;width:100%;height:24px;margin-top:4px}
.vcell .g .up{color:#4ade80}
.vcell .g .stop{color:var(--faint)}
.cmf{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:2px}
.cmf::-webkit-scrollbar{display:none}
.cmf button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;padding:5px 12px;min-height:34px;cursor:pointer;display:flex;align-items:center;gap:5px}
.cmf button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.cmf button i{width:7px;height:7px;border-radius:50%}
.cm{padding:10px 0;border-top:1px solid var(--line)}
.cm .who{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.cm .who i{width:7px;height:7px;border-radius:50%;flex:none}
.cm .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm .who em{font-style:normal;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;flex:none}
.cm .who span{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto}
.cm p{margin:3px 0 0 14px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.cm.rp{padding-left:16px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.note{font-size:12px;color:var(--faint);margin-top:18px}
.pnote{font-size:13px;color:var(--muted)}
/* 選題 */
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk b{font-size:20px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)}
/* 10-07i 發片日程（買了啦） */
.ip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.ip button{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;color:var(--text);font:inherit;min-width:0}
.ip button.on{border-color:var(--accent);background:var(--surface2)}
.ip button[disabled]{opacity:.55;cursor:default}
.ip img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px}
.ip b{font-size:13px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ip .pr{font-family:var(--num);font-size:17px;font-weight:700;color:var(--accent);margin-top:2px}
.ip .pr s{color:var(--muted);font-size:12px;font-weight:400;margin-left:4px}
.ip small{font-size:11.5px;color:var(--muted)}
.ip .tk{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:15px;font-weight:700}
.ip button.on .tk{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.ip .tg{position:absolute;top:6px;left:6px;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.sched p{display:flex;gap:10px;align-items:baseline;margin:8px 0;font-size:15px;line-height:1.5}
.sched p b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:13px;display:grid;place-items:center;font-family:var(--num)}
.topic{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;position:relative}
.topic.on{border-color:var(--accent);background:var(--surface2)}
.topic.dim{opacity:.45}
.topic .hd{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.topic .rank{font-family:var(--num);font-size:13px;color:var(--muted);font-weight:600}
.topic .tt{font-size:17px;font-weight:700;margin:2px 36px 6px 0;line-height:1.35}
.topic .why{font-size:13px;color:var(--muted)}
.topic .facts{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.topic .tick{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:14px;font-weight:700}
.topic.on .tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.hooks{display:grid;gap:8px;margin-top:10px}
.hooks .lab{font-size:12px;color:var(--muted)}
.hk{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);cursor:pointer;font-size:15px;line-height:1.4}
.hk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hk.static{cursor:default}
.warnf{color:var(--warn)}
/* 審片 */
.rv{background:var(--surface);border-radius:14px;padding:12px;margin-top:12px}
.rv .player{aspect-ratio:9/16;max-height:68vh;width:100%;background:#000;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.rv video{width:100%;height:100%;object-fit:contain;display:block}
.rv .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:12px 2px 4px}
.rv .head b{font-size:17px;line-height:1.35}
.rv .slot{font-size:13px;color:var(--accent);white-space:nowrap}
.rv .qa{font-size:13px;color:var(--muted);margin:6px 2px}
.rv details{margin:8px 2px;font-size:13px;color:var(--muted)}
.rv details summary{cursor:pointer;color:var(--text)}
.rv details pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{flex:1}
/* 修改意見：整頁蓋上來的輸入頁，高度跟著「鍵盤以外看得到的範圍」（visualViewport），字不會被鍵盤擋住；字級 ≥16px，iPhone 才不會自動放大畫面（10-04 Benson：輸入時很醜、看不到自己打的字） */
.sheet{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100%);z-index:50;background:var(--ground);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.sheet[hidden]{display:none}
.sh-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-top b{flex:1;min-width:0;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-top .btn{padding:9px 14px}
.sh-hint{font-size:13px;color:var(--muted);margin:0 2px 8px}
#shText{flex:1;min-height:96px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6;resize:none;color:var(--text)}
#shText::placeholder{color:var(--faint)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px}
.qlink{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;font-size:14px}
.qlink small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qlink i{font-style:normal;color:var(--accent);font-size:22px;line-height:1}
/* 10-06c 工作進度（state.plan）：每支片一列＋步驟點 */
.plan{padding:12px 0;border-top:1px solid var(--line)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.plan .ph small{color:var(--muted);font-size:12px;white-space:nowrap}
.steps{display:flex;gap:4px;margin-top:8px}
.steps span{flex:1;min-width:0;font-size:11px;text-align:center;color:var(--faint);padding-top:8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps span::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:2px;background:var(--line)}
.steps span.done{color:var(--muted)} .steps span.done::before{background:var(--ok)}
.steps span.doing{color:var(--text);font-weight:700} .steps span.doing::before{background:var(--accent)}
.plan .pn{font-size:12px;color:var(--muted);margin-top:6px}
.links{display:flex;gap:10px;font-size:12px;margin-top:2px}
.links a{color:var(--muted)}
.links .q{color:var(--muted);opacity:.6}
.sent{margin-top:10px;font-size:13px;color:var(--ok)}
.sent.err{color:var(--bad)}
/* 送出列與分頁列 */
.sticky{flex:none;padding:10px 16px;background:var(--ground);border-top:1px solid var(--line)}
.sticky .wrap{display:flex;gap:10px;align-items:center}
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:2px 0 max(6px,env(safe-area-inset-bottom,0px))}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.tab .ic{position:relative;width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab[aria-selected="true"] .ic{background:rgba(255,210,63,.16)}
.tab .badge{position:absolute;top:-4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;line-height:18px;font-family:var(--num)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* 鎖 */
.lock{max-width:360px;margin:12vh auto 0;text-align:center;padding:0 16px}
.lock img{width:84px;height:84px;border-radius:50%;margin-bottom:14px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;text-align:center}
.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.lock button:disabled{opacity:.5}
.lock .msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast,.detail{transition:none}}
</style>
</head>
<body>
<div class="scroll" id="scroller"><div class="wrap" id="app"></div></div>
<div class="sticky" id="pickBar" hidden><div class="wrap"><span class="pnote" id="pickCount"></span><button class="btn primary wide" id="pickSubmit" type="button" disabled>送出</button></div></div>
<nav class="tabs" id="tabs" role="tablist" hidden><div class="wrap">
  <button class="tab" role="tab" data-v="data" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>數據</button>
  <button class="tab" role="tab" data-v="topics" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="bTopics" hidden></span></span><span id="tTopics">選題</span></button>
  <button class="tab" role="tab" data-v="review" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2.5v9L17 14"/></svg><span class="badge" id="bReview" hidden></span></span>審片</button>
</div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sh-top"><button class="btn" id="shCancel" type="button">取消</button><b id="shTitle"></b><button class="btn primary" id="shSend" type="button">送出</button></div>
  <p class="sh-hint">寫下要改哪裡，送出後會照你的意見重做。</p>
  <textarea id="shText" placeholder="例如：開頭那句太慢、第 20 秒的畫面不是這種動物…"></textarea>
</div>
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="dbar"><button class="back" id="dBack" type="button" aria-label="返回">‹ 返回</button><b id="dTitle"></b><button class="tocm" id="dToCm" type="button"></button></div>
  <div class="dscroll" id="dScroll"><div class="wrap" id="dBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){function fit(){var h=window.innerHeight,r=document.documentElement.style,vv=window.visualViewport;
    r.setProperty('--app-h',h+'px');window.__appH=h;
    r.setProperty('--vv-h',(vv?vv.height:h)+'px');r.setProperty('--vv-top',(vv?vv.offsetTop:0)+'px');}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);window.visualViewport.addEventListener('scroll',fit);}document.addEventListener('visibilitychange',fit);})();
(function () {
  'use strict';
  /* 荒野數據（2026-10-02 起把原本 claude.ai 控制台的選題、審片併進來）
     讀：stats 分支的 stats.json（四平台數據）、work.json（製作進度）；media 分支的 epNN.bin（預覽片，AES-GCM）
     10-05c 多頻道：stats.json 裡的 channels 是頻道清單；荒野檔案用 stats.json／work.json，其他頻道用 stats-<id>.json／work-<id>.json；
       上方頻道按鈕切換，挑題／審片的動作帶 ch（沒帶＝荒野檔案，對應 animal-shorts/channels.json）
     寫：Benson 按的挑題／審片 ⇒ 加密成封包 ⇒ 用 live/wtoken.json 裡（加密過）的寫入金鑰放進 inbox 分支
         ⇒ 電腦每 10 分鐘的 live_stats.py 收進來（animal-shorts/live/work.py）
     解密跟 animal-shorts/live/wfcrypto.py（＝交易手機監控同一套）：PBKDF2 ⇒ k_enc‖k_mac；HMAC 金鑰流；影片鑰匙 = HMAC(k_enc,"wfvideo1") */
  var REPO = 'xd1104/wildfiles';
  var API = function (p, ref) { return 'https://api.github.com/repos/' + REPO + '/contents/' + p + '?ref=' + ref; };
  var RAW = function (p, ref) { return 'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/' + p; };
  var LS = 'wfl.key.v1', LS_SHARED = 'tlmon.key.v1', LS_TAB = 'wfl.tab', LS_PEND = 'wfl.pending', LS_PICK = 'wfl.picks.';
  var MAGIC = new TextEncoder().encode('tlmon1');
  var PF = [{k:'yt',n:'YouTube',c:'var(--yt)'},{k:'tt',n:'TikTok',c:'var(--tt)'},{k:'ig',n:'Instagram',c:'var(--ig)'},{k:'fb',n:'Facebook',c:'var(--fb)'}];
  var $ = function (id) { return document.getElementById(id); };
  var LS_CH='wfl.ch',DEF='wildfiles';
  var S = { keys:null, stats:null, statsT:0, work:null, token:null, tokenState:'?', tab:'data', picks:{}, videoUrl:{}, busy:false, ch:DEF, chans:[], all:{} };
  var etags = {};

  /* ── bytes / crypto ── */
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function ub64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
  function cat(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length;}return o;}
  function eq(a,b){if(a.length!==b.length)return false;var d=0;for(var i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}
  function derive(pw,salt,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,512);})
    .then(function(bits){var u=new Uint8Array(bits);return {salt:ub64(salt),iter:iter,enc:u.slice(0,32),mac:u.slice(32)};});}
  function hk(raw){return crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign']);}
  function hm(key,d){return crypto.subtle.sign('HMAC',key,d).then(function(s){return new Uint8Array(s);});}
  function stream(kEnc,nonce,n){return hk(kEnc).then(function(h){var jobs=[];for(var i=0;i<Math.ceil(n/32);i++)jobs.push(hm(h,cat(nonce,new Uint8Array([(i>>>24)&255,(i>>>16)&255,(i>>>8)&255,i&255]))));
    return Promise.all(jobs).then(function(bl){return cat.apply(null,bl).subarray(0,n);});});}
  function open(bx,k){var nonce=b64(bx.nonce),ct=b64(bx.ct),tag=b64(bx.tag),t=new TextEncoder().encode(String(bx.t));
    return hk(k.mac).then(function(h){return hm(h,cat(MAGIC,t,nonce,ct));}).then(function(want){
      if(!eq(want,tag))throw new Error('bad');
      return stream(k.enc,nonce,ct.length).then(function(ks){var pt=new Uint8Array(ct.length);for(var j=0;j<ct.length;j++)pt[j]=ct[j]^ks[j];return JSON.parse(new TextDecoder().decode(pt));});});}
  function seal(obj,k){var t=String(Math.floor(Date.now()/1000)),pt=new TextEncoder().encode(JSON.stringify(obj)),nonce=crypto.getRandomValues(new Uint8Array(16));
    return stream(k.enc,nonce,pt.length).then(function(ks){var ct=new Uint8Array(pt.length);for(var j=0;j<pt.length;j++)ct[j]=pt[j]^ks[j];
      return hk(k.mac).then(function(h){return hm(h,cat(MAGIC,new TextEncoder().encode(t),nonce,ct));}).then(function(tag){
        return {v:1,t:+t,kdf:{alg:'PBKDF2-SHA256',iter:k.iter,salt:k.salt},nonce:ub64(nonce),ct:ub64(ct),tag:ub64(tag)};});});}
  function videoKey(k){return hk(k.enc).then(function(h){return hm(h,new TextEncoder().encode('wfvideo1'));})
    .then(function(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);});}
  function loadKeys(name){try{var o=JSON.parse(localStorage.getItem(name)||'null');if(!o)return null;return {salt:o.salt,iter:o.iter,enc:b64(o.enc),mac:b64(o.mac)};}catch(e){return null;}}
  function saveKeys(k){try{localStorage.setItem(LS,JSON.stringify({salt:k.salt,iter:k.iter,enc:ub64(k.enc),mac:ub64(k.mac)}));}catch(e){}}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  /* ── 讀 ── */
  function getBox(path,ref){var h={'Accept':'application/vnd.github.raw'},key=ref+':'+path;if(etags[key])h['If-None-Match']=etags[key].tag;
    /* 10-07：沒帶金鑰的 API 一小時只能 60 次，App 每 90 秒讀好幾個檔很快用完 ⇒ 掉到 raw 網址（GitHub 快取 5 分鐘，數據會晚到 15 分鐘）
       ⇒ 有寫入金鑰就一起帶上（一小時 5000 次） */
    if(S.token)h['Authorization']='Bearer '+S.token;
    return fetch(API(path,ref),{headers:h,cache:'no-store'}).then(function(r){
      if(r.status===304&&etags[key])return etags[key].box;if(r.status===404)return null;if(!r.ok)throw new Error('api '+r.status);
      var tag=r.headers.get('ETag');return r.json().then(function(b){if(tag)etags[key]={tag:tag,box:b};return b;});})
    .catch(function(e){if(e&&e.message==='bad')throw e;return fetch(RAW(path,ref)+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('raw '+r.status);return r.json();});});}
  function loadAll(){return getBox('stats.json','stats').then(function(b0){if(!b0)throw new Error('nodata');
      return open(b0,S.keys).then(function(d0){
        S.chans=(d0.channels&&d0.channels.length)?d0.channels:[{id:DEF,name:'荒野檔案',sub:'WILD FILES',active:true,stats:'stats.json',work:'work.json'}];
        return Promise.all(S.chans.map(function(c){
          var sp=c.stats==='stats.json'?Promise.resolve([b0,d0]):getBox(c.stats,'stats').then(function(b){return b?open(b,S.keys).then(function(d){return [b,d];}):[null,null];});
          var wp=getBox(c.work,'stats').then(function(b){return b?open(b,S.keys):null;});
          return Promise.all([sp,wp]).then(function(r){S.all[c.id]={stats:r[0][1],statsT:r[0][0]?r[0][0].t:0,work:r[1]||{videos:{}}};});}));});})
      .then(function(){if(!S.all[S.ch])S.ch=DEF;useCh();});}
  function useCh(){var a=S.all[S.ch]||{};S.stats=a.stats||null;S.statsT=a.statsT||0;S.work=a.work||{videos:{}};}
  function chan(id){id=id||S.ch;return S.chans.filter(function(c){return c.id===id;})[0]||{id:id,name:id};}
  function setCh(id){if(!S.all[id]||id===S.ch)return;S.ch=id;lsSet(LS_CH,id);useCh();render();$('scroller').scrollTop=0;}
  /* 各頻道的 localStorage key：荒野檔案沿用舊 key（手機上已存的挑題草稿不會不見） */
  function ck(k){return S.ch===DEF?k:k+S.ch+':';}
  function myAct(a){return (a.ch||DEF)===S.ch;}
  function loadToken(){if(S.token)return Promise.resolve(S.token);
    return fetch('wtoken.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok){S.tokenState='none';return null;}return r.json();})
      .then(function(bx){if(!bx)return null;return open(bx,S.keys).then(function(o){S.token=o.token;S.tokenState='ok';return o.token;});})
      .catch(function(){S.tokenState='none';return null;});}

  /* ── 寫：動作放進 inbox 分支 ── */
  function send(action){
    if(S.busy)return Promise.reject(new Error('busy'));S.busy=true;
    action.id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);action.at=new Date().toISOString();
    return loadToken().then(function(tok){if(!tok)throw new Error('notoken');return seal(action,S.keys).then(function(box){
      var body={message:'inbox '+action.type,branch:'inbox',content:ub64(new TextEncoder().encode(JSON.stringify(box)))};
      return fetch('https://api.github.com/repos/'+REPO+'/contents/inbox/'+action.id+'.json',{method:'PUT',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});});})
    .then(function(r){if(!r.ok)throw new Error('put '+r.status);var p=lsGet(LS_PEND,{});p[action.id]=action;lsSet(LS_PEND,p);S.busy=false;return action;})
    .catch(function(e){S.busy=false;throw e;});}
  function pending(all){var p=lsGet(LS_PEND,{}),acks={},out=[],changed=false;
    for(var c in S.all){var ak=(S.all[c].work&&S.all[c].work.acks)||{};for(var x in ak)acks[x]=ak[x];}
    for(var id in p){if(acks[id]){delete p[id];changed=true;}else if(Date.now()-new Date(p[id].at).getTime()>3*86400e3){delete p[id];changed=true;}else if(all||myAct(p[id]))out.push(p[id]);}
    if(changed)lsSet(LS_PEND,p);return out;}
  function sendErr(e){var m=String(e&&e.message);return m==='notoken'?'還沒設定寫入金鑰（電腦上跑一次 setup_write_token.py）':m.indexOf('put 401')===0||m.indexOf('put 403')===0?'寫入金鑰失效或權限不夠':'沒送出去，網路不穩再試一次';}

  /* ── 小工具 ── */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return n==null?'—':Number(n).toLocaleString('zh-TW');}
  function plus(n){return n==null?'':(n>0?'<span class="up">+'+fmt(n)+'</span>':n<0?fmt(n):'±0');}
  function ago(sec){sec=Math.max(0,Math.round(sec));if(sec<90)return '剛剛';if(sec<3600)return Math.round(sec/60)+' 分鐘前';var h=Math.floor(sec/3600);return h<48?h+' 小時前':Math.floor(h/24)+' 天前';}
  var WD='日一二三四五六';
  function slot(iso){if(!iso)return '';var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2600);}
  function no2(n){return '#'+String(n).padStart(2,'0');}

  /* ── 鎖 ── */
  function lockView(msg){
    $('tabs').hidden=true;$('pickBar').hidden=true;
    $('app').innerHTML='<div class="lock"><img src="../avatar.jpg" alt=""><h1>荒野數據</h1><p>輸入荒野數據的密碼</p>'+
      '<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">'+
      '<label><input id="rem" type="checkbox" checked> 記住這台手機</label><button id="go" type="submit">打開</button></form><div class="msg" id="msg">'+esc(msg||'')+'</div></div>';
    $('f').addEventListener('submit',function(ev){ev.preventDefault();var pw=$('pw').value,go=$('go'),m=$('msg');if(!pw)return;
      go.disabled=true;go.textContent='解鎖中…';m.textContent='';
      getBox('stats.json','stats').then(function(bx){return derive(pw,b64(bx.kdf.salt),bx.kdf.iter).then(function(k){return open(bx,k).then(function(){S.keys=k;if($('rem').checked)saveKeys(k);return boot();});});})
      .catch(function(e){go.disabled=false;go.textContent='打開';m.textContent=String(e.message)==='bad'?'密碼不對，再試一次':'讀不到資料，檢查網路後再試';});});
    setTimeout(function(){var p=$('pw');p&&p.focus();},50);
  }

  /* ── 分頁 ── */

  /* ── 數據 ── */
  function sumAt(h,key){var s=0,any=false;for(var p in (h[key]||{})){if(h[key][p]!=null){s+=h[key][p];any=true;}}return any?s:null;}
  function past(hist,hours){var cut=Date.now()-hours*3600e3,best=null;for(var i=0;i<hist.length;i++){if(new Date(hist[i].at).getTime()<=cut)best=hist[i];}return best;}
  function chart(hist){
    /* 10-06b2：Benson 嫌累積曲線怪（Y 軸從 3 千多開始、看不出現在還有沒有在漲）⇒ 改成每小時新增觀看，各平台堆疊 */
    var now=Date.now(),cut=now-72*3600e3,pts=hist.filter(function(x){return new Date(x.at).getTime()>=cut-3600e3;});
    if(pts.length<3)return '<div class="empty">累積幾次更新後，這裡會畫出每小時新增的觀看。</div>';
    var H0=Math.floor(cut/3600e3),N=72,bins=[];for(var i=0;i<N;i++){bins.push({});}
    for(var j=1;j<pts.length;j++){var a0=pts[j-1],a1=pts[j],tt=new Date(a1.at).getTime(),bi=Math.floor(tt/3600e3)-H0-1;if(bi<0||bi>=N)continue;
      PF.forEach(function(pp){var v0=a0.v&&a0.v[pp.k],v1=a1.v&&a1.v[pp.k];if(v0!=null&&v1!=null&&v1>v0)bins[bi][pp.k]=(bins[bi][pp.k]||0)+(v1-v0);});}
    var hi=1;bins.forEach(function(x){var s=0;for(var k in x)s+=x[k];hi=Math.max(hi,s);});
    var W=340,H=150,l=34,r=6,t=10,b=22,iw=W-l-r,ih=H-t-b,bw=iw/N,g='';
    bins.forEach(function(x,i){var y=t+ih;PF.forEach(function(pp){var v=x[pp.k];if(!v)return;var hh=v/hi*ih;y-=hh;g+='<rect x="'+(l+i*bw+0.4).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-0.8).toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+pp.c+'"/>';});});
    g+='<text x="'+(l-5)+'" y="'+(t+8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(hi)+'</text><text x="'+(l-5)+'" y="'+(t+ih)+'" text-anchor="end" font-size="10" fill="var(--muted)">0</text>';
    for(var dd=0;dd<=3;dd++){var tt=(H0+1)*3600e3+dd*24*3600e3;if(tt>now)break;var x=l+(tt/3600e3-H0-1)*bw,D=new Date(tt);

    var key=PF.map(function(pp){return '<span><i style="background:'+pp.c+'"></i>'+({ig:'IG',fb:'FB'}[pp.k]||pp.n)+'</span>';}).join('');
    return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近 3 天每小時新增觀看">'+g+'</svg><div class="ckey">'+key+'</div></div>';
  }
  /* 每支片每個平台：從發片開始的累積觀看小曲線＋近 3 小時增加（0＝平台停止推了） */
  function spark(hist,ep,k,slotT,color){
    var pts=[];hist.forEach(function(x){var tt=new Date(x.at).getTime();if(slotT&&tt<slotT)return;var e=x.e&&x.e[ep];if(e&&e[k]!=null)pts.push({t:tt,v:e[k]});});
    if(pts.length<2)return {svg:'',d3:null};
    var W=100,H=26,t0=slotT||pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+1),hi=1;pts.forEach(function(p){hi=Math.max(hi,p.v);});
    var X=function(tt){return (tt-t0)/(t1-t0)*W;},Y=function(v){return H-1-v/hi*(H-3);},d='';
    pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);});

  /* 10-07f 數據頁精簡版（Benson 看 10-07e 嫌太亂 ⇒ 照 work/data-research/ux-demo-slim.html）：

  function pname(k){return {ig:'IG',fb:'FB'}[k]||(PF.filter(function(p){return p.k===k;})[0]||{}).n||k;}

    return Object.keys(E).filter(function(ep){var e=E[ep];return by[ep]&&e.slot&&new Date(e.slot).getTime()<=now;})
      .map(function(ep){var e=E[ep],v=by[ep],bad={};((e.badWatch)||[]).forEach(function(k){bad[k]=1;});

  function alerts(){if(!S.stats)return '';var d=S.stats,age=(Date.now()/1000)-S.statsT,a=[];

  /* 一行摘要：第 N／12 支・最高 X・訂閱 Y／1,000；點開才看營利一句（有效觀看有值才畫進度條） */
  function summary(d,eps){

    var q=ev.target.closest('[data-q]');if(q){var t=document.getElementById(q.dataset.q);t.hidden=!t.hidden;q.setAttribute('aria-expanded',String(!t.hidden));}});
  $('app').addEventListener('click',function(ev){var t=ev.target;if(!t.closest)return;
    var c=t.closest('.vid[data-ep]');if(c){openDetail(c.dataset.ep);return;}
    if(t.closest('#sum')){S.sumOpen=!S.sumOpen;render();}});
  /* 「更多」開著就記住，自動更新重畫時不要收起來 */
  $('app').addEventListener('toggle',function(ev){if(ev.target&&ev.target.id==='more')S.moreOpen=ev.target.open;},true);

  /* ── 選題 ── */
  /* 10-07i：發片日程（channels.json 的 schedule）。next 的 ok＝看過官方 DM 確認；沒確認的標「推算」 */
  function scheduleView(){var sc=chan().schedule,wd='日一二三四五六',today=new Date();today.setHours(0,0,0,0);
    var nx=(sc.next||[]).filter(function(x){return new Date(x.d+'T00:00:00')>=today;});
    var h='<h2>發片規則</h2><div class="sched">'+(sc.rules||[]).map(function(r,i){return '<p><b>'+(i+1)+'</b>'+esc(r)+'</p>';}).join('')+'</div>';
    var md=function(s){var d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+'（'+wd.charAt(d.getDay())+'）';};
    h+='<h2>接下來要發的</h2>'+(nx.length?nx.map(function(x){   /* 10-07j（Benson：各個檔期是何時？）：每列寫出整檔起訖 */
      /* 10-07l：只做好市多、每週一支 ⇒ 列頭＝發片日＋第幾支，小字＝那一檔起訖（b～e） */
      return '<div class="row"><div><b>'+md(x.d)+'</b>　'+esc(x.s)+(x.t?' '+esc(x.t):'')+'<small>18:00 發'+(x.b&&x.e?'・這檔 '+md(x.b)+'～'+md(x.e):'')+'</small></div>'+
        '<span class="pill'+(x.ok?' ok':'')+'">'+(x.ok?'官方已公布':'官方還沒公布')+'</span></div>';}).join(''):'<div class="empty">還沒排。</div>');
    h+='<h2>各家檔期</h2>'+(sc.stores||[]).map(function(s){return '<div class="row"><div><b>'+esc(s.s)+'</b><small>'+esc(s.cycle)+'</small></div><div class="pnote" style="margin:0">這檔 '+esc(s.now)+'</div></div>';}).join('');
    if(sc.note)h+='<p class="pnote">'+esc(sc.note)+'</p>';
    return h;}
  function itemsView(){var ip=S.work&&S.work.itemPick;if(!ip||!ip.items)return '';
    var p=pending().filter(function(a){return a.type==='items'&&a.pick===ip.id;})[0],pk=ck(LS_PICK)+'items:'+ip.id,open=ip.status==='picking'&&!p,need=ip.need||10;
    if(open&&!S.picks[pk])S.picks[pk]=lsGet(pk,{});
    var sel={};if(open)sel=S.picks[pk];else (p?p.items:(ip.picks||[])).forEach(function(id){sel[id]=1;});
    var n=Object.keys(sel).length,st=p?'已送出，等電腦收':open?'已選 '+n+' / '+need:ip.pickedBy==='producer'?'沒挑，製作人代挑了':'已挑好，製作中';
    var h='<h2>挑商品・'+esc(ip.title||'')+'</h2><div class="wk"><b>從 '+ip.items.length+' 樣裡挑 '+need+' 樣</b><span class="pill '+(open?'warn':'ok')+'">'+st+'</span></div>'+
      (open&&ip.deadline?'<p class="pnote">'+esc(slot(ip.deadline))+' 前沒挑，製作人會先用排前面的。標「試片用過」的是上一支試片放過的。</p>':'');
    h+='<div class="ip">'+ip.items.map(function(x){var on=x.id in sel;
      return '<button type="button" data-ip="'+esc(x.id)+'" class="'+(on?'on':'')+'" '+(open?'':'disabled')+' aria-pressed="'+on+'">'+
        (x.tag?'<span class="tg">'+esc(x.tag)+'</span>':'')+'<span class="tk">'+(on?'✓':'')+'</span>'+
        (x.img?'<img src="'+esc(x.img)+'" alt="" loading="lazy">':'')+'<b>'+esc(x.name)+'</b>'+
        '<span class="pr">$'+x.price+(x.unit&&x.unit!=='元'?esc(x.unit.replace('元',''))
        :'')+(x.orig?'<s>'+x.orig+'</s>':'')+'</span><small>'+esc(x.spec||'')+(x.unitp?'・'+esc(x.unitp):'')+'</small></button>';}).join('')+'</div>';
    return h;}
  function bindItems(){var ip=S.work&&S.work.itemPick;if(!ip)return;var pk=ck(LS_PICK)+'items:'+ip.id,need=ip.need||10;
    document.querySelectorAll('[data-ip]').forEach(function(b){b.addEventListener('click',function(){var sel=S.picks[pk]||(S.picks[pk]={}),id=b.dataset.ip;
      if(id in sel)delete sel[id];else{if(Object.keys(sel).length>=need){toast('最多 '+need+' 樣，先取消一個');return;}sel[id]=1;}
      lsSet(pk,sel);var y=$('scroller').scrollTop;render();$('scroller').scrollTop=y;});});}
  function topicsView(){
    var w=S.work&&S.work.week;
    if(chan().schedule&&!(w&&w.topics&&w.topics.length))return itemsView()+scheduleView();
    if(!w||!w.topics||!w.topics.length)return '<h2>本週選題</h2><div class="empty">'+(chan().active===false?esc(chan().name)+' 還在籌備中。<br>頻道風格定好、正式開工後，每週的題目會出現在這裡。':'這週的題目還沒出來。<br>每週五 09:00 企劃會提下週的 5 個題目，到時候這裡會通知你。')+'</div>';
    var p=pending().filter(function(a){return a.type==='pick'&&a.week===w.id;})[0],pk=ck(LS_PICK)+w.id;
    var open=w.status==='picking'&&!p;
    if(open&&!S.picks[pk])S.picks[pk]=lsGet(pk,{});
    var sel=open?S.picks[pk]:{};
    if(!open){(p?p.picks:(w.picks||[])).forEach(function(x){sel[x.id]=x.hook;});}
    var need=w.pickCount||3,st=p?'已送出，等電腦收':open?'挑 '+need+' 個，每個選一句開場':w.pickedBy==='producer'?'你沒選，製作人代挑了':'已選好，製作中';
    var h='<div class="wk"><b>'+esc(w.label||w.id)+'</b><span class="pill '+(open?'warn':'ok')+'">'+st+'</span></div>'+
      '<p class="pnote">'+(open?(w.deadline?esc(slot(w.deadline))+' 前沒選，製作人會挑'+(need===1?'排名第 1 的':'排名前 '+need+' 的')+'、用第一句開場。':''):'這'+(need===1?'支':'週的 '+need+' 支')+'會在 '+esc(w.slotsText||'週二、週四、週六')+' 11:30 發。')+'</p>';
    h+=w.topics.map(function(tp,i){var on=tp.id in sel,hooks=tp.hooks||[];
      var hh='';if(hooks.length&&(on||!open)){hh='<div class="hooks"><span class="lab">'+(open?'選一句開場：':'開場：')+'</span>'+hooks.map(function(s,j){
        if(!open)return on&&sel[tp.id]===j?'<div class="hk static" aria-pressed="true">'+esc(s)+'</div>':'';
        return '<button type="button" class="hk" data-t="'+esc(tp.id)+'" data-h="'+j+'" aria-pressed="'+(sel[tp.id]===j)+'">「'+esc(s)+'」</button>';}).join('')+'</div>';}
      return '<div class="topic'+(on?' on':'')+(!open&&!on?' dim':'')+'"><button type="button" class="hd" data-t="'+esc(tp.id)+'" '+(open?'':'disabled')+' aria-pressed="'+on+'"><span class="tick">'+(on?'✓':'')+'</span>'+
        '<div class="rank">企劃排名 '+(i+1)+(tp.animal?'　·　'+esc(tp.animal):'')+'</div><div class="tt">'+esc(tp.title)+'</div>'+
        (tp.why?'<div class="why">'+esc(tp.why)+'</div>':'')+
        '<div class="facts">'+(tp.film==null?'':typeof tp.film==='number'?'<span class="'+(tp.film<4?'warnf':'')+'">4K 實拍素材 '+esc(tp.film)+' 支'+(tp.film<4?'（偏少）':'')+'</span>':'<span>畫面：'+esc(tp.film)+'</span>')+(tp.source?'<span>來源：'+esc(tp.source)+'</span>':'')+'</div></button>'+hh+'</div>';}).join('');
    return h;
  }
  function bindTopics(){var w=S.work.week;if(!w)return;var pk=ck(LS_PICK)+w.id;
    document.querySelectorAll('.topic .hd').forEach(function(b){b.addEventListener('click',function(){var sel=S.picks[pk],id=b.dataset.t;
      if(id in sel)delete sel[id];else{var need=w.pickCount||3;if(need===1){for(var k in sel)delete sel[k];}else if(Object.keys(sel).length>=need){toast('最多 '+need+' 個，先取消一個');return;}sel[id]=0;}
      lsSet(pk,sel);render();});});
    document.querySelectorAll('.hk[data-t]').forEach(function(b){b.addEventListener('click',function(){S.picks[pk][b.dataset.t]=+b.dataset.h;lsSet(pk,S.picks[pk]);render();});});
  }
  function pickBar(){var w=S.work&&S.work.week,ip=S.work&&S.work.itemPick;
    if(S.tab==='topics'&&needItems()){$('pickBar').hidden=false;var ni=Object.keys(S.picks[ck(LS_PICK)+'items:'+ip.id]||{}).length,nn=ip.need||10;
      $('pickCount').textContent='已選 '+ni+' / '+nn+' 樣';$('pickSubmit').disabled=ni!==nn||S.busy;return;}
    var show=S.tab==='topics'&&needPick();$('pickBar').hidden=!show;if(!show)return;
    var n=Object.keys(S.picks[ck(LS_PICK)+w.id]||{}).length,need=w.pickCount||3;$('pickCount').textContent='已選 '+n+' / '+need;$('pickSubmit').disabled=n!==need||S.busy;}
  $('pickSubmit').addEventListener('click',function(){
    var ip=S.work&&S.work.itemPick;if(needItems()){var isel=S.picks[ck(LS_PICK)+'items:'+ip.id]||{},ids2=ip.items.map(function(x){return x.id;}).filter(function(id){return id in isel;});
      if(ids2.length!==(ip.need||10))return;$('pickSubmit').disabled=true;$('pickSubmit').textContent='送出中…';
      send({type:'items',ch:S.ch,pick:ip.id,items:ids2}).then(function(){toast('送出了，電腦最慢 10 分鐘內收');$('pickSubmit').textContent='送出';render();})
        .catch(function(e){toast(sendErr(e));$('pickSubmit').textContent='送出';pickBar();});return;}
    var w=S.work.week,sel=S.picks[ck(LS_PICK)+w.id]||{},ids=Object.keys(sel);if(ids.length!==(w.pickCount||3))return;
    var order=w.topics.map(function(t){return t.id;}).filter(function(id){return id in sel;});
    $('pickSubmit').disabled=true;$('pickSubmit').textContent='送出中…';
    send({type:'pick',ch:S.ch,week:w.id,picks:order.map(function(id){return {id:id,hook:sel[id]};})})
      .then(function(){toast('送出了，電腦最慢 10 分鐘內收');$('pickSubmit').textContent='送出';render();})
      .catch(function(e){toast(sendErr(e));$('pickSubmit').textContent='送出';pickBar();});});

  /* ── 審片 ── */
  function reviewView(){
    var v=(S.work&&S.work.videos)||{},p=pending(),eps=Object.keys(v).sort(function(a,b){return (v[a].no||0)-(v[b].no||0);});
    var pend=function(e){return p.filter(function(a){return a.type==='review'&&a.ep===e;})[0];};
    var rv=eps.filter(function(e){return v[e].status==='review'&&!pend(e);});
    var h='<h2>等你看</h2>'+(rv.length?rv.map(function(e){return card(e,v[e]);}).join(''):'<div class="empty">沒有等你看的片。挑完題目後，做好的片會陸續送過來（發片當天 09:00 前要按好）。</div>');
    var sent=eps.filter(function(e){return pend(e);});
    if(sent.length)h+='<h2>你剛送出的</h2>'+sent.map(function(e){var a=pend(e);return row(e,v[e],'<span class="pill">'+(a.decision==='approved'?'好，照排':a.decision==='revise'?'要修改':'改回待審')+'・等電腦收</span>');}).join('');
    var ok=eps.filter(function(e){return v[e].status==='approved'&&!pend(e);});
    if(ok.length)h+='<h2>你說好了，等排程</h2>'+ok.map(function(e){return row(e,v[e],'<button class="btn" data-undo="'+e+'" type="button" style="padding:6px 12px;font-size:13px">改回待審</button>');}).join('');
    var fix=eps.filter(function(e){return (v[e].status==='revise'||v[e].status==='producing')&&!pend(e);});
    if(fix.length)h+='<h2>製作中／修改中</h2>'+fix.map(function(e){return row(e,v[e],'<span class="pill warn">'+(v[e].status==='revise'?'照你的意見修改中':'製作中')+'</span>',v[e].note?'你的意見：'+v[e].note:'');}).join('');
    h+=planView();
    var done=eps.filter(function(e){return v[e].status==='scheduled'||v[e].status==='published';}).reverse();
    if(done.length)h+='<h2>已排程／已發布</h2>'+done.map(function(e){return row(e,v[e],'<span class="pill '+(v[e].status==='published'?'ok':'')+'">'+(v[e].status==='published'?'已發布':'已排程')+'</span>','',v[e].links);}).join('');
    return h;
  }
  /* 10-06c：工作進度。state.plan＝[{title, slot, steps:[{t:"讀 DM", s:"done|doing|todo"}], note}]，電腦做片時隨時更新 */
  function planView(){var pl=(S.work&&S.work.plan)||[];if(!pl.length)return '';
    return '<h2>工作進度・接下來要發的</h2>'+pl.map(function(x){
      var st=(x.steps||[]).map(function(k){return '<span class="'+esc(k.s||'todo')+'">'+esc(k.t)+'</span>';}).join('');
      return '<div class="plan"><div class="ph"><b>'+esc(x.title)+'</b><small>'+esc(x.slot?slot(x.slot)+' 發':'')+'</small></div>'+
        (st?'<div class="steps">'+st+'</div>':'')+(x.note?'<div class="pn">'+esc(x.note)+'</div>':'')+'</div>';}).join('');}
  function card(e,v){
    /* 10-07：切回審片頁影片會自己播 ⇒ autoplay 只給剛按「播放」的那一支，用一次就清掉 */
    var vk=S.ch+':'+e,ap=S.justPlayed===vk;if(ap)S.justPlayed=null;
    var pl=S.videoUrl[vk]?'<video src="'+S.videoUrl[vk]+'" controls playsinline'+(ap?' autoplay':'')+'></video>':
      v.preview?'<button class="btn" data-play="'+e+'" type="button">▶ 播放預覽（'+(v.preview.size/1048576).toFixed(1)+' MB）</button>':'<span class="pnote">預覽片還在上傳</span>';
    return '<div class="rv"><div class="player" id="pl-'+e+'">'+pl+'</div>'+
      '<div class="head"><b><span class="no">'+no2(v.no)+'</span>'+esc(v.title)+'</b><span class="slot">'+esc(slot(v.slot))+' 發</span></div>'+
      (v.qa?'<div class="qa">品管：'+esc(v.qa)+'</div>':'')+
      (v.caption?'<details><summary>上架標題與說明</summary><pre>'+esc(v.caption)+'</pre></details>':'')+
      '<div class="acts"><button class="btn" data-fix="'+e+'" type="button">要修改</button><button class="btn primary wide" data-ok="'+e+'" type="button">好，照排</button></div></div>';}
  function row(e,v,right,sub,links){
    /* 10-06a：TikTok／IG／FB 要等發出去才有網址 ⇒ 還沒網址但已排程的平台顯示灰字「已排」（排程紀錄在 v.sched：tt、meta＝FB+IG） */
    var sc=v.sched||{}, queued={tt:!!sc.tt, ig:!!(sc.meta||(v.meta&&v.meta.ig)), fb:!!(sc.meta||(v.meta&&v.meta.fb)), yt:!!sc.yt};
    links=links||{};
    var L=[['yt','YouTube'],['tt','TikTok'],['ig','IG'],['fb','FB']].map(function(x){
      if(links[x[0]])return '<a href="'+esc(links[x[0]])+'" target="_blank" rel="noopener">'+x[1]+'</a>';
      if(v.status==='scheduled'&&queued[x[0]])return '<span class="q">'+x[1]+' 已排</span>';
      return '';}).join('');
    return '<div class="row"><div><span class="no">'+no2(v.no)+'</span>'+esc(v.title)+'<small>'+esc(slot(v.slot))+(sub?'　'+esc(sub):'')+'</small>'+(L?'<div class="links">'+L+'</div>':'')+'</div><div>'+right+'</div></div>';}
  function bindReview(){
    document.querySelectorAll('[data-play]').forEach(function(b){b.addEventListener('click',function(){play(b.dataset.play,b);});});
    document.querySelectorAll('[data-ok]').forEach(function(b){b.addEventListener('click',function(){decide(b.dataset.ok,'approved');});});
    document.querySelectorAll('[data-fix]').forEach(function(b){b.addEventListener('click',function(){openSheet(b.dataset.fix);});});
    document.querySelectorAll('[data-undo]').forEach(function(b){b.addEventListener('click',function(){decide(b.dataset.undo,'review');});});
  }
  /* 修改意見輸入頁（不重畫審片頁，影片照樣在底下） */
  var sheetEp=null;
  function openSheet(e){var v=S.work.videos[e];sheetEp=e;
    $('shTitle').textContent='要修改 '+no2(v.no)+' '+(v.title||'');$('shText').value=lsGet(ck('wfl.note.')+e,'');
    $('sheet').hidden=false;$('shText').focus();}
  function closeSheet(){$('sheet').hidden=true;$('shText').blur();sheetEp=null;}
  $('shText').addEventListener('input',function(){if(sheetEp)lsSet(ck('wfl.note.')+sheetEp,$('shText').value);});
  $('shCancel').addEventListener('click',closeSheet);
  $('shSend').addEventListener('click',function(){var n=$('shText').value.trim();if(!n){toast('寫一下要改哪裡');return;}var e=sheetEp;closeSheet();decide(e,'revise',n);});
  function play(e,btn){var v=S.work.videos[e];btn.disabled=true;btn.textContent='下載中…';
    Promise.all([fetch(RAW(v.preview.file,'media')+'?v='+v.preview.v).then(function(r){if(!r.ok)throw new Error('dl '+r.status);return r.arrayBuffer();}),videoKey(S.keys)])
      .then(function(x){var u=new Uint8Array(x[0]);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},x[1],u.subarray(12));})
      .then(function(pt){S.videoUrl[S.ch+':'+e]=URL.createObjectURL(new Blob([pt],{type:'video/mp4'}));S.justPlayed=S.ch+':'+e;render();})
      .catch(function(){btn.disabled=false;btn.textContent='沒載入成功，再按一次';});}
  function decide(e,dec,note){
    send({type:'review',ch:S.ch,ep:e,decision:dec,note:note||''}).then(function(){try{localStorage.removeItem(ck('wfl.note.')+e);}catch(x){}
      toast(dec==='approved'?'收到，電腦收到後就會排程':dec==='revise'?'收到，會照你的意見修改':'已改回待審');render();})
      .catch(function(err){toast(sendErr(err));});}

  /* ── 開機 ── */
  /* 自動更新會整頁重畫，正在看的預覽片會被換掉而停掉（10-04 Benson：全螢幕播到一半突然停）
     ⇒ 審片頁有載入的影片、或正在打修改意見時，自動更新只抓資料不重畫；按「重新整理」或送出決定才重畫 */
  function busyUI(){return !$('sheet').hidden||(S.tab==='review'&&!!document.querySelector('.rv video'));}
  function refresh(manual){var b=$('re');if(b)b.textContent='更新中…';
    return loadAll().then(function(){if(!manual&&busyUI()){var r=$('re');if(r)r.textContent='重新整理';return;}render();refreshDetail();})
      .catch(function(){if(b)b.textContent='沒連上，再按一次';});}
  var timer=null;
  function boot(){return loadAll().then(function(){
    $('tabs').hidden=false;var hs=(location.hash||'').slice(1).split(':'),t=hs[0]||lsGet(LS_TAB,'data');
    if(hs[1]&&S.all[hs[1]]&&hs[1]!==S.ch){S.ch=hs[1];lsSet(LS_CH,S.ch);useCh();}if(location.hash)history.replaceState(null,'',location.pathname);setTab(['data','topics','review'].indexOf(t)>=0?t:'data');loadToken();
    clearInterval(timer);timer=setInterval(function(){if(!document.hidden)refresh();},90000);});}
  document.addEventListener('visibilitychange',function(){if(document.hidden){document.querySelectorAll('video').forEach(function(v){try{v.pause();}catch(x){}});return;}if(S.keys&&S.stats)refresh();});

  S.ch=lsGet(LS_CH,DEF);
  S.keys=loadKeys(LS)||loadKeys(LS_SHARED);
  if(!S.keys){lockView();return;}
  $('app').innerHTML='<p class="note" style="text-align:center;margin-top:30vh">讀取中…</p>';
  getBox('stats.json','stats').then(function(bx){if(!bx||S.keys.salt!==bx.kdf.salt){S.keys=null;lockView();return;}return boot();})
    .catch(function(e){S.keys=null;lockView(String(e.message)==='bad'?'記住的密碼已經換過，請重新輸入':'');});
})();
</script>
